<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0033CC">
<title>Kenan Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   DESIGN TOKENS — ตรงกับ Kenan Connect Vision ใน Stitch
   ───────────────────────────────────────────────────────────── */
:root{
  --primary:#0033CC;
  --primary-dark:#0011AD;
  --secondary:#0044FF;
  --neutral:#EBECEF;

  --ink:#0F172A;
  --ink-2:#475569;
  --ink-3:#94A3B8;
  --bg:#F6F7F9;
  --surface:#FFFFFF;
  --line:#E2E6EC;

  --ok:#059669;
  --ok-bg:#ECFDF5;
  --warn:#D97706;
  --warn-bg:#FFFBEB;
  --danger:#DC2626;
  --danger-bg:#FEF2F2;

  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --shadow-lg:0 8px 32px rgba(15,23,42,.14);

  --topbar-h:56px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);

  --font:'Plus Jakarta Sans','Noto Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.5;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
[hidden]{display:none!important}

/* ── App shell ─────────────────────────────────────────────── */
#app{min-height:100dvh;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:40;
  height:var(--topbar-h);flex:0 0 auto;
  display:flex;align-items:center;gap:4px;
  padding:0 6px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.topbar .icon-btn{
  width:40px;height:40px;border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto;
}
.topbar .icon-btn:active{background:var(--neutral)}
.topbar h1{
  flex:1;min-width:0;margin:0;padding:0 4px;
  font-size:16px;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding-left:8px}
.brand .mark{
  width:28px;height:28px;border-radius:8px;flex:0 0 auto;
  background:var(--primary);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:15px;
}
.brand .txt{font-size:16px;font-weight:700;letter-spacing:-.01em}
.bell{position:relative}
.bell .dot{
  position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--danger);color:#fff;
  font-size:10px;font-weight:700;line-height:17px;text-align:center;
  border:2px solid var(--surface);
}

main{flex:1 1 auto;padding:16px 16px calc(var(--nav-h) + var(--safe-b) + 24px)}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── Bottom nav ────────────────────────────────────────────── */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line);
}
.nav button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);font-size:10.5px;font-weight:600;
}
.nav button.on{color:var(--primary)}
.nav svg{width:23px;height:23px}

/* ── FAB: ปุ่มบันทึกพัสดุเข้า — เข้าถึงได้ 1 แตะจากทุกหน้า ──── */
.fab{
  position:fixed;right:16px;z-index:45;
  bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  height:52px;padding:0 20px 0 16px;border-radius:26px;
  display:flex;align-items:center;gap:8px;
  background:var(--primary);color:#fff;
  font-weight:700;font-size:14px;
  box-shadow:0 6px 20px rgba(0,51,204,.36);
}
.fab:active{transform:scale(.97)}
.fab svg{width:22px;height:22px}

/* ── Cards & layout ────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card + .card{margin-top:12px}
.section-title{font-size:13px;font-weight:700;color:var(--ink-2);margin:22px 0 10px;letter-spacing:.01em}
.section-title:first-child{margin-top:0}
.section-title .en{font-weight:500;color:var(--ink-3);font-size:11px;margin-left:6px}

.greet{margin:0 0 18px}
.greet h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}
.greet p{margin:3px 0 0;color:var(--ink-3);font-size:13px}

/* ── Module tiles ──────────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{
  position:relative;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:15px 14px;min-height:104px;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .12s,box-shadow .12s;
}
.tile:active{transform:scale(.975);box-shadow:var(--shadow)}
.tile .ic{
  width:38px;height:38px;border-radius:11px;
  background:#EEF3FF;color:var(--primary);
  display:grid;place-items:center;
}
.tile .ic svg{width:21px;height:21px}
.tile .nm{font-size:14.5px;font-weight:700;line-height:1.3}
.tile .en{font-size:11px;color:var(--ink-3);font-weight:500;margin-top:1px}
.tile .badge{
  position:absolute;top:11px;right:11px;
  padding:3px 8px;border-radius:99px;
  font-size:10.5px;font-weight:700;
  background:var(--primary);color:#fff;
}
.tile .badge.warn{background:var(--warn)}
.tile.soon{opacity:.5}
.tile.soon .badge{background:var(--neutral);color:var(--ink-3)}
.tile.sos .ic{background:#FEF2F2;color:var(--danger)}

/* ── List rows ─────────────────────────────────────────────── */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--bg)}
.row .thumb{
  width:48px;height:48px;border-radius:10px;flex:0 0 auto;
  background:var(--neutral);object-fit:cover;
  display:grid;place-items:center;color:var(--ink-3)
}
.row .body{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .go{color:var(--ink-3);flex:0 0 auto}
.row .go svg{width:18px;height:18px;display:block}

.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.pill.wait{background:var(--warn-bg);color:var(--warn)}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.new{background:#EEF3FF;color:var(--primary)}

/* ── Forms ─────────────────────────────────────────────────── */
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field label .en{font-weight:400;color:var(--ink-3);font-size:11px;margin-left:5px}
.field label .req{color:var(--danger);margin-left:3px}
.field input,.field select,.field textarea{
  width:100%;padding:13px 14px;
  border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--surface);font-size:16px; /* 16px กัน iOS zoom */
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,51,204,.1)
}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.field .err{font-size:12px;color:var(--danger);margin-top:5px;font-weight:600}

.btn{
  width:100%;padding:15px;border-radius:var(--r);
  font-size:15.5px;font-weight:700;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:active:not(:disabled){background:var(--primary-dark)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:#EEF3FF;color:var(--primary)}
.btn.danger{background:var(--danger);color:#fff}
.btn + .btn{margin-top:9px}
.btn svg{width:20px;height:20px}

/* ปุ่มหลักติดขอบล่าง — อยู่ในระยะนิ้วโป้งเสมอ */
.sticky-cta{
  position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
  margin-top:20px;z-index:20;
}

/* ── Camera capture ────────────────────────────────────────── */
.shot{
  position:relative;width:100%;aspect-ratio:4/3;
  border-radius:var(--r-lg);overflow:hidden;
  background:var(--ink);display:grid;place-items:center;
}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .ph{color:#fff;text-align:center;opacity:.85;padding:20px}
.shot .ph svg{width:44px;height:44px;margin-bottom:8px}
.shot .ph p{margin:0;font-size:13px;font-weight:600}
.shot .retake{
  position:absolute;right:10px;bottom:10px;
  padding:8px 14px;border-radius:99px;
  background:rgba(15,23,42,.72);color:#fff;
  font-size:12.5px;font-weight:700;backdrop-filter:blur(8px);
}

/* ── Skeleton — ไม่เคยแสดงหน้าขาว ───────────────────────────── */
.sk{background:linear-gradient(90deg,#E9ECF1 25%,#F2F4F7 50%,#E9ECF1 75%);
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:var(--r-sm)}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-row{height:74px;margin-bottom:10px;border-radius:var(--r-lg)}

/* ── Empty state ───────────────────────────────────────────── */
.empty{text-align:center;padding:44px 24px;color:var(--ink-3)}
.empty svg{width:46px;height:46px;margin-bottom:12px;opacity:.5}
.empty h3{margin:0 0 5px;font-size:15px;font-weight:700;color:var(--ink-2)}
.empty p{margin:0;font-size:13px;line-height:1.6}

/* ── Toast ─────────────────────────────────────────────────── */
#toast{
  position:fixed;left:16px;right:16px;z-index:80;
  bottom:calc(var(--nav-h) + var(--safe-b) + 78px);
  padding:14px 16px;border-radius:var(--r);
  background:var(--ink);color:#fff;font-size:14px;font-weight:600;
  box-shadow:var(--shadow-lg);
  transform:translateY(20px);opacity:0;pointer-events:none;
  transition:.22s;
}
#toast.on{transform:none;opacity:1}
#toast.ok{background:var(--ok)}
#toast.bad{background:var(--danger)}

/* ── Bottom sheet — ยืนยันเร็วๆ โดยไม่ต้องเปลี่ยนหน้า ────────── */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.42);opacity:0;transition:.22s;pointer-events:none}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:8px 16px calc(20px + var(--safe-b));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:86dvh;overflow:auto;
}
#sheet.on{transform:none}
#sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
#sheet h3{margin:0 0 4px;font-size:17px;font-weight:700}
#sheet .sub{margin:0 0 16px;font-size:13px;color:var(--ink-3)}

/* ── Consent / PDPA ────────────────────────────────────────── */
.legal{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;max-height:38dvh;overflow:auto;
  font-size:13px;line-height:1.75;color:var(--ink-2);
}
.legal h4{margin:14px 0 5px;font-size:13.5px;color:var(--ink);font-weight:700}
.legal h4:first-child{margin-top:0}
.legal ul{margin:5px 0;padding-left:18px}
.check{display:flex;gap:11px;align-items:flex-start;margin:15px 0;cursor:pointer}
.check input{width:21px;height:21px;flex:0 0 auto;margin-top:1px;accent-color:var(--primary)}
.check span{font-size:13.5px;line-height:1.55}

/* ── Lang toggle ───────────────────────────────────────────── */
.langsw{display:inline-flex;background:var(--neutral);border-radius:9px;padding:2px}
.langsw button{padding:6px 15px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.langsw button.on{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.09)}

.note{
  display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);
  background:var(--warn-bg);border:1px solid #FDE68A;
  font-size:12.5px;line-height:1.6;color:#92400E;
}
.note.info{background:#EEF3FF;border-color:#C7D7FE;color:#1E40AF}
.note svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px}

.contact-group{margin-bottom:18px}
.contact-group > h3{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.callbtn{
  width:42px;height:42px;border-radius:50%;flex:0 0 auto;
  background:var(--ok);color:#fff;display:grid;place-items:center;
}
.callbtn.sos{background:var(--danger)}
.callbtn svg{width:20px;height:20px}

@media(min-width:600px){
  main{max-width:560px;margin:0 auto;width:100%}
  .tiles{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="backBtn" hidden aria-label="ย้อนกลับ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="brand" id="brand"><div class="mark">K</div><div class="txt">Kenan Connect</div></div>
    <h1 id="title" hidden></h1>
    <button class="icon-btn bell" id="bellBtn" aria-label="การแจ้งเตือน">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
      <span class="dot" id="bellDot" hidden>0</span>
    </button>
  </header>

  <main id="main"></main>

  <nav class="nav" id="nav" hidden>
    <button data-go="home" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span>หน้าแรก</span>
    </button>
    <button data-go="my-parcels">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>
      <span>พัสดุ</span>
    </button>
    <button data-go="calltree">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg>
      <span>ฉุกเฉิน</span>
    </button>
    <button data-go="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>ฉัน</span>
    </button>
  </nav>

  <button class="fab" id="fab" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <span>บันทึกพัสดุ</span>
  </button>
</div>

<div id="scrim"></div>
<div id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>
<div id="toast"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   KENAN CONNECT — Single Page App

/* ── 4. API — คุยกับ Apps Script เดิม (ไม่ต้องรื้อ backend) ───── */
async function api(action, payload = {}, method = 'GET'){
  if(DEMO){
    await new Promise(r => setTimeout(r, 260));       // จำลองดีเลย์จริง จะได้เห็น skeleton
    return MOCK[action] ?? { ok:true };
  }
  if(!CFG.GAS_URL || CFG.GAS_URL.startsWith('PASTE_')) throw new Error('NO_CONFIG');
  const base = CFG.GAS_URL;
  let res;
  if(method === 'GET'){
    const q = new URLSearchParams({ action, uid:S.uid||'', ...payload });
    res = await fetch(`${base}?${q}`, { method:'GET', redirect:'follow' });
  }else{
    // text/plain = simple request → ไม่มี CORS preflight ที่ Apps Script ตอบไม่ได้
    res = await fetch(base, {
      method:'POST', redirect:'follow',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, uid:S.uid, ...payload })
    });
  }
  const text = await res.text();
  try { return JSON.parse(text); }
  catch(e){ throw new Error('BAD_RESPONSE'); }
}
// GAS ตอบ HTML แทน JSON เป็นครั้งคราวตอนโหลดหนัก → ลองซ้ำสั้นๆ
async function apiRetry(action, payload, method, tries = 2){
  for(let i = 0; i <= tries; i++){
    try{ return await api(action, payload, method); }
    catch(e){
      if(e.message === 'NO_CONFIG' || i === tries) throw e;
      await new Promise(r => setTimeout(r, 400 * (i + 1)));
    }
  }
}

/* ── 6. ROUTER — เปลี่ยนหน้าทันที ไม่โหลดใหม่ ─────────────────── */
const ROUTES = {};
function go(name, params = {}, replace = false){
  if(!replace) S.stack.push({ name, params });
  render(name, params);
}
function back(){
  S.stack.pop();
  const prev = S.stack[S.stack.length - 1] || { name:'home', params:{} };
  render(prev.name, prev.params);
}
$('#backBtn').onclick = back;

function chrome(name){
  const isHome = name === 'home';
  const isFull = ['register','consent','gate'].includes(name);
  $('#backBtn').hidden = isHome || isFull;
  $('#brand').hidden   = !isHome;
  $('#title').hidden   = isHome;
  $('#nav').hidden     = isFull;
  $('#bellBtn').hidden = isFull;
  // FAB โผล่เฉพาะหน้าที่ไม่ใช่หน้าบันทึกเอง — บันทึกพัสดุได้จากทุกที่ใน 1 แตะ
  $('#fab').hidden = isFull || name === 'parcel-in' || !S.isOfficer;
  document.querySelectorAll('.nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.go === name || (name === 'parcel-in' && b.dataset.go === 'my-parcels')));
}
async function render(name, params){
  chrome(name);
  const fn = ROUTES[name] || ROUTES.home;
  $('#main').innerHTML = `<div class="view">${skeleton(2)}</div>`;
  try{ await fn(params); }
  catch(e){

ROUTES['parcel-in'] = async () => {
  setTitle(t('inTitle'));
  $('#main').innerHTML = `<div class="view">
    <label class="shot" id="shot">
      <input type="file" accept="image/*" capture="environment" id="file" hidden>
      <div class="ph">${IC.cam}<p>${esc(t('inShoot'))}</p>
        <p style="opacity:.7;font-weight:400;margin-top:4px">${esc(t('inShootSub'))}</p></div>
    </label>
    <div style="margin-top:14px" id="afterShot" hidden>
      <button class="btn soft" id="scanBtn">${esc(t('inScan'))}</button>
      <div class="field" style="margin-top:16px">
        <label>${esc(t('inRecipient'))}<span class="en">${esc(t('inRecipientEn'))}</span></label>
        <select id="rcp"><option value="">${esc(t('inPick'))}</option>
          <option value="__unknown__">${esc(t('inUnknown'))}</option></select>
      </div>
      <div class="field">
        <label>${esc(t('inTracking'))}</label>
        <input id="trk" inputmode="latin" autocomplete="off" placeholder="TH01234567890">
      </div>
      <div class="sticky-cta"><button class="btn primary" id="saveBtn">${esc(t('inSave'))}</button></div>
    </div>
  </div>`;

  const fileEl = $('#file');
  $('#shot').onclick = e => { if(e.target.tagName !== 'INPUT') fileEl.click(); };
  fileEl.onchange = async () => {
    const f = fileEl.files[0]; if(!f) return;
    const b64 = await shrink(f, 1280);
    S.draft.photo = b64;
    $('#shot').innerHTML = `<img src="${b64}" alt=""><span class="retake">${esc(t('inRetake'))}</span>`;
    $('#shot').onclick = () => fileEl.click();
    $('#afterShot').hidden = false;
  };

  // โหลดรายชื่อพนักงานล่วงหน้า — ตอนกดจะไม่ต้องรอ
  if(!S.employees.length){
    try{ const r = await apiRetry('getEmployees', {}, 'GET'); S.employees = r?.items || r?.employees || []; }catch(e){}
  }
  const sel = $('#rcp');
  S.employees.forEach(p => {
    const o = document.createElement('option');
    o.value = p.kenan_user_id || p.uid || p.email || p.name;
    o.textContent = p.nickname ? `${p.name_th || p.name} (${p.nickname})` : (p.name_th || p.name);
    o.dataset.json = JSON.stringify(p);
    sel.appendChild(o);
  });
  sel.onchange = () => {
    const btn = $('#saveBtn');
    btn.textContent = sel.value === '__unknown__' ? t('inSaveUnknown') : t('inSave');
  };

  $('#scanBtn').onclick = async () => {
    const b = $('#scanBtn'); b.disabled = true; b.textContent = t('inScanning');
    try{
      const r = await apiRetry('scanParcelPhoto', { photo:S.draft.photo }, 'POST');
      if(r?.trackingNo) $('#trk').value = r.trackingNo;
      const guess = (r?.recipientName || '').trim();
      let matched = false;
      if(guess){
        for(const o of sel.options){
          if(o.textContent.includes(guess) || guess.includes(o.textContent.split(' (')[0])){
            sel.value = o.value; matched = true; break;
          }
        }
      }
      toast(matched ? t('inScanOk') : t('inScanFail'), matched ? 'ok' : '');
    }catch(e){ toast(t('inScanFail')); }
    b.disabled = false; b.textContent = t('inScan');
  };

  $('#saveBtn').onclick = async () => {
    if(!S.draft.photo){ toast(t('inNeedPhoto'), 'bad'); return; }
    const unknown = sel.value === '__unknown__' || !sel.value;
    const btn = $('#saveBtn'); btn.disabled = true;
    try{
      const chosen = sel.selectedOptions[0]?.dataset.json ? JSON.parse(sel.selectedOptions[0].dataset.json) : null;
      await apiRetry('logParcel', {
        photo:S.draft.photo,
        recipient_id: unknown ? '' : (chosen?.kenan_user_id || sel.value),
        recipient_name: unknown ? '' : (chosen?.name_th || chosen?.name || ''),
        recipient_email: chosen?.email || '',
        recipient_line: chosen?.line_user_id || '',
        tracking_no: $('#trk').value.trim(),
        status: unknown ? 'unidentified' : 'arrived'
      }, 'POST');
      S.draft = { photo:null, scan:null, recipient:null, tracking:'' };
      toast(unknown ? t('inDoneUnknown') : t('inDone'), 'ok');
      go('parcel-in', {}, true);   // พร้อมถ่ายชิ้นถัดไปทันที ไม่ต้องกดกลับ
    }catch(e){ toast(t('netErr'), 'bad'); btn.disabled = false; }
  };
};

    <li>Photos of parcels, equipment or reported issues, and timestamps of each step</li></ul>
    <h4>How it is used</h4>
    <ul><li>Identifying parcel recipients and notifying them</li>
    <li>Confirming handover and return of items</li>
    <li>Contacting you in an emergency</li></ul>
    <p>It is not used for performance evaluation and is not disclosed outside the organisation.</p>
    <h4>Parcel label photos</h4>
    <p>These may contain a third-party sender's name and address. Only the portion needed to identify the recipient is displayed, and images are deleted at the end of the retention period.</p>
    <h4>Service providers involved</h4>
    <p>LINE (notifications and sign-in) and Google (data and image storage).</p>
    <h4>Your rights</h4>
    <p>You may request access, correction or deletion of your data at any time, and unlink your LINE account, by contacting the system administrator.</p>`;

  $('#main').innerHTML = `<div class="view">
    <div class="greet"><h2>${esc(t('consentTitle'))}</h2><p>${esc(t('consentTitleEn'))}</p></div>
    <div class="legal">${body}</div>
    ${readonly ? '' : `
      <label class="check"><input type="checkbox" id="agree"><span>${esc(t('consentAgree'))}</span></label>
      <button class="btn primary" id="okConsent" disabled>${esc(t('consentBtn'))}</button>`}
  </div>`;
  if(readonly) return;
  $('#agree').onchange = e => $('#okConsent').disabled = !e.target.checked;
  $('#okConsent').onclick = async () => {
    const b = $('#okConsent'); b.disabled = true;
    try{ await apiRetry('acceptConsent', { consent_version:CFG.CONSENT_VERSION }, 'POST'); }catch(e){}
    S.me = S.me || {}; S.me.consent_at = new Date().toISOString();
    S.stack = [];
    go(S.regStatus === 'approved' ? 'home' : 'register');
  };
};

/* ── Gate: ยังไม่ได้ล็อกอิน ───────────────────────────────────── */
ROUTES.gate = async () => {
  $('#main').innerHTML = `<div class="view" style="padding-top:48px">
    ${emptyState(IC.info, t('needLogin'), t('needLoginBody'))}
    <button class="btn primary" id="lg">${esc(t('loginLine'))}</button></div>`;
  $('#lg').onclick = () => { if(S.liffReady) liff.login(); else location.reload(); };
};

/* ── 8. Utils ─────────────────────────────────────────────────── */
function shrink(file, max){
  return new Promise((res, rej) => {
    const img = new Image(), fr = new FileReader();
    fr.onload = () => img.src = fr.result;
    fr.onerror = rej;
    img.onload = () => {
      let { width:w, height:h } = img;
      const sc = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * sc); h = Math.round(h * sc);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);   // canvas ทิ้ง EXIF รวมถึง GPS
      res(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = rej;
    fr.readAsDataURL(file);
  });
}

/* ── 9. BOOT — LIFF init ครั้งเดียวสำหรับทั้งแอป ───────────────── */
(async function boot(){
  try{ if(navigator.language?.startsWith('en')) S.lang = 'en'; }catch(e){}

  if(DEMO){
    S.uid = 'U-demo';
    S.profile = { displayName:'พิพัฒน์ ส.', pictureUrl:'' };
    const a = MOCK.getAuthState;
    S.me = a.user; S.isAdmin = a.isAdmin; S.isOfficer = a.isOfficer;
    S.regStatus = a.registrationStatus; S.notifCount = a.notificationCount;
    $('#bellDot').textContent = S.notifCount; $('#bellDot').hidden = false;
    const banner = el(`<div style="background:#FFFBEB;border-bottom:1px solid #FDE68A;color:#92400E;
      font-size:11.5px;font-weight:600;text-align:center;padding:6px 12px">
      โหมดพรีวิว · ข้อมูลตัวอย่าง · ใส่ CFG.GAS_URL เพื่อใช้งานจริง</div>`);
    document.querySelector('.topbar').after(banner);
    go('home');
    return;
  }

  const timeout = new Promise(r => setTimeout(() => r('timeout'), CFG.LIFF_TIMEOUT_MS));
  try{
    const r = await Promise.race([
      liff.init({ liffId:CFG.LIFF_ID }).then(() => 'ok').catch(() => 'fail'),
      timeout
    ]);
    if(r === 'ok'){
      S.liffReady = true;
      if(!liff.isLoggedIn()){ liff.login(); return; }
      S.profile = await liff.getProfile();
      S.uid = S.profile.userId;
    }
  }catch(e){}

  if(!S.uid){ go('gate'); return; }

  try{
    const auth = await apiRetry('getAuthState', {}, 'GET');
    S.me       = auth?.user || null;
    S.isAdmin  = !!auth?.isAdmin;
    S.isOfficer= !!(auth?.isAdmin || auth?.isOfficer);
    S.regStatus= auth?.registrationStatus || (S.me ? 'approved' : 'none');
    S.notifCount = auth?.notificationCount || 0;
    if(S.notifCount){ $('#bellDot').textContent = S.notifCount; $('#bellDot').hidden = false; }
  }catch(e){
    if(e.message === 'NO_CONFIG'){ render('home'); return; }
    S.regStatus = 'none';
  }

  if(!S.me?.consent_at)          go('consent');
  else if(S.regStatus !== 'approved') go('register');
  else                                go('home');
})();
</script>
