<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0033CC">
<title>Kenan Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   DESIGN TOKENS — ตรงกับ Kenan Connect Vision ใน Stitch
   ───────────────────────────────────────────────────────────── */
:root{
  --primary:#0033CC;
  --primary-dark:#0011AD;
  --secondary:#0044FF;
  --neutral:#EBECEF;

  --ink:#0F172A;
  --ink-2:#475569;
  --ink-3:#94A3B8;
  --bg:#F6F7F9;
  --surface:#FFFFFF;
  --line:#E2E6EC;

  --ok:#059669;
  --ok-bg:#ECFDF5;
  --warn:#D97706;
  --warn-bg:#FFFBEB;
  --danger:#DC2626;
  --danger-bg:#FEF2F2;
  /* ชื่อย่อที่โค้ดเรียกใช้อยู่หลายที่ ถ้าไม่ประกาศไว้ สีแดงจะหายไปเงียบๆ
     (หน้าฉุกเฉิน เส้นเวลาปัจจุบัน ปุ่มยกเลิก เรื่องด่วน) */
  --bad:#DC2626;
  --bad-bg:#FEF2F2;
  --bad-line:#FECACA;

  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --shadow-lg:0 8px 32px rgba(15,23,42,.14);

  --topbar-h:56px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);

  --font:'Plus Jakarta Sans','Noto Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.5;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
[hidden]{display:none!important}

/* ── App shell ─────────────────────────────────────────────── */
#app{min-height:100dvh;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:40;
  height:var(--topbar-h);flex:0 0 auto;
  display:flex;align-items:center;gap:4px;
  padding:0 6px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.topbar .icon-btn{
  width:40px;height:40px;border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto;
}
.topbar .icon-btn:active{background:var(--neutral)}
.topbar h1{
  flex:1;min-width:0;margin:0;padding:0 4px;
  font-size:16px;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding-left:8px}
.brand .mark{
  width:28px;height:28px;border-radius:8px;flex:0 0 auto;
  background:var(--primary);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:15px;
}
.brand .txt{font-size:16px;font-weight:700;letter-spacing:-.01em}
.bell{position:relative}
.bell .dot{
  position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--danger);color:#fff;
  font-size:10px;font-weight:700;line-height:17px;text-align:center;
  border:2px solid var(--surface);
}

main{flex:1 1 auto;padding:16px 16px calc(var(--nav-h) + var(--safe-b) + 24px)}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── Bottom nav ────────────────────────────────────────────── */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);border-top:1px solid var(--line);
}
.nav button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);font-size:10.5px;font-weight:600;
}
.nav button.on{color:var(--primary)}
.nav svg{width:23px;height:23px}

/* ── FAB: ปุ่มบันทึกพัสดุเข้า — เข้าถึงได้ 1 แตะจากทุกหน้า ──── */
.fab{
  position:fixed;right:16px;z-index:45;
  bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  height:52px;padding:0 20px 0 16px;border-radius:26px;
  display:flex;align-items:center;gap:8px;
  background:var(--primary);color:#fff;
  font-weight:700;font-size:14px;
  box-shadow:0 6px 20px rgba(0,51,204,.36);
}
.fab:active{transform:scale(.97)}
.fab svg{width:22px;height:22px}

/* ── Cards & layout ────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card + .card{margin-top:12px}
.section-title{font-size:13px;font-weight:700;color:var(--ink-2);margin:22px 0 10px;letter-spacing:.01em}
.section-title:first-child{margin-top:0}
.section-title .en{font-weight:500;color:var(--ink-3);font-size:11px;margin-left:6px}

.greet{margin:0 0 18px}
.greet h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}
.greet p{margin:3px 0 0;color:var(--ink-3);font-size:13px}

/* ── Module tiles ──────────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{
  position:relative;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:15px 14px;min-height:104px;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .12s,box-shadow .12s;
}
.tile:active{transform:scale(.975);box-shadow:var(--shadow)}
.tile .ic{
  width:38px;height:38px;border-radius:11px;
  background:#EEF3FF;color:var(--primary);
  display:grid;place-items:center;
}
.tile .ic svg{width:21px;height:21px}
.tile .nm{font-size:14.5px;font-weight:700;line-height:1.3}
.tile .en{font-size:11px;color:var(--ink-3);font-weight:500;margin-top:1px}
.tile .badge{
  position:absolute;top:11px;right:11px;
  padding:3px 8px;border-radius:99px;
  font-size:10.5px;font-weight:700;
  background:var(--primary);color:#fff;
}
.tile .badge.warn{background:var(--warn)}
.tile.soon{opacity:.5}
.tile.soon .badge{background:var(--neutral);color:var(--ink-3)}
.tile.sos .ic{background:#FEF2F2;color:var(--danger)}

/* ── List rows ─────────────────────────────────────────────── */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--bg)}
.row .thumb{
  width:48px;height:48px;border-radius:10px;flex:0 0 auto;
  background:var(--neutral);object-fit:cover;
  display:grid;place-items:center;color:var(--ink-3)
}
.row .body{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .go{color:var(--ink-3);flex:0 0 auto}
.row .go svg{width:18px;height:18px;display:block}

.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.pill.wait{background:var(--warn-bg);color:var(--warn)}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.new{background:#EEF3FF;color:var(--primary)}

/* ── Forms ─────────────────────────────────────────────────── */
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field label .en{font-weight:400;color:var(--ink-3);font-size:11px;margin-left:5px}
.field label .req{color:var(--danger);margin-left:3px}
.field input,.field select,.field textarea{
  width:100%;padding:13px 14px;
  border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--surface);font-size:16px; /* 16px กัน iOS zoom */
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,51,204,.1)
}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.field .err{font-size:12px;color:var(--danger);margin-top:5px;font-weight:600}

.btn{
  width:100%;padding:15px;border-radius:var(--r);
  font-size:15.5px;font-weight:700;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:active:not(:disabled){background:var(--primary-dark)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:#EEF3FF;color:var(--primary)}
.btn.danger{background:var(--danger);color:#fff}
.btn + .btn{margin-top:9px}
.btn svg{width:20px;height:20px}

/* ปุ่มหลักติดขอบล่าง — อยู่ในระยะนิ้วโป้งเสมอ */
.sticky-cta{
  position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
  margin-top:20px;z-index:20;
}

/* ── Camera capture ────────────────────────────────────────── */
.shot{
  position:relative;width:100%;aspect-ratio:4/3;
  border-radius:var(--r-lg);overflow:hidden;
  background:var(--ink);display:grid;place-items:center;
}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .ph{color:#fff;text-align:center;opacity:.85;padding:20px}
.shot .ph svg{width:44px;height:44px;margin-bottom:8px}
.shot .ph p{margin:0;font-size:13px;font-weight:600}
.shot .retake{
  position:absolute;right:10px;bottom:10px;
  padding:8px 14px;border-radius:99px;
  background:rgba(15,23,42,.72);color:#fff;
  font-size:12.5px;font-weight:700;backdrop-filter:blur(8px);
}

/* ── Skeleton — ไม่เคยแสดงหน้าขาว ───────────────────────────── */
.sk{background:linear-gradient(90deg,#E9ECF1 25%,#F2F4F7 50%,#E9ECF1 75%);
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:var(--r-sm)}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-row{height:74px;margin-bottom:10px;border-radius:var(--r-lg)}

/* ── Empty state ───────────────────────────────────────────── */
.empty{text-align:center;padding:44px 24px;color:var(--ink-3)}
.empty svg{width:46px;height:46px;margin-bottom:12px;opacity:.5}
.empty h3{margin:0 0 5px;font-size:15px;font-weight:700;color:var(--ink-2)}
.empty p{margin:0;font-size:13px;line-height:1.6}

/* ── Toast ─────────────────────────────────────────────────── */
#toast{
  position:fixed;left:16px;right:16px;z-index:80;
  bottom:calc(var(--nav-h) + var(--safe-b) + 78px);
  padding:14px 16px;border-radius:var(--r);
  background:var(--ink);color:#fff;font-size:14px;font-weight:600;
  box-shadow:var(--shadow-lg);
  transform:translateY(20px);opacity:0;pointer-events:none;
  transition:.22s;
}
#toast.on{transform:none;opacity:1}
#toast.ok{background:var(--ok)}
#toast.bad{background:var(--danger)}

/* ── Bottom sheet — ยืนยันเร็วๆ โดยไม่ต้องเปลี่ยนหน้า ────────── */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.42);opacity:0;transition:.22s;pointer-events:none}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:8px 16px calc(20px + var(--safe-b));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:86dvh;overflow:auto;
}
#sheet.on{transform:none}
#sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
#sheet h3{margin:0 0 4px;font-size:17px;font-weight:700}
#sheet .sub{margin:0 0 16px;font-size:13px;color:var(--ink-3)}

/* ── ดูรูปเต็มจอ + ซูม (ต้องอ่านจ่าหน้าซองให้ออก) ─────────────── */
#lb{position:fixed;inset:0;z-index:90;background:#0B0F17;display:none;flex-direction:column}
#lb.on{display:flex}
#lb .top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;color:#fff;flex:0 0 auto}
#lb .top b{font-size:14px;font-weight:700}
#lb .x{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);
  display:grid;place-items:center;color:#fff;font-size:20px;line-height:1}
#lbStage{flex:1;overflow:hidden;position:relative;touch-action:none;display:grid;place-items:center}
#lbImg{max-width:100%;max-height:100%;transform-origin:center center;
  transition:transform .16s ease-out;will-change:transform;user-select:none;-webkit-user-drag:none}
#lb .zoom{display:flex;gap:10px;justify-content:center;align-items:center;
  padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 16px);flex:0 0 auto}
#lb .zb{min-width:56px;height:46px;padding:0 16px;border-radius:23px;background:rgba(255,255,255,.16);
  color:#fff;font-size:19px;font-weight:800;display:grid;place-items:center}
#lb .zb.wide{font-size:13.5px;font-weight:700}
#lb .hint{color:rgba(255,255,255,.55);font-size:11.5px;text-align:center;padding-bottom:4px}

/* รูปใหญ่ใน sheet ยืนยันรับของ */
.sheet-photo{width:100%;border-radius:12px;background:var(--neutral);display:block;
  aspect-ratio:4/3;object-fit:cover;margin-bottom:6px}
.sheet-photo-hint{font-size:11.5px;color:var(--primary);font-weight:700;text-align:center;margin:0 0 14px}

/* ── ตัวเลือกผู้รับแบบค้นหา (40+ คน เลื่อนหาไม่ไหว) ────────────── */
.picker-btn{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--surface);text-align:left;display:flex;align-items:center;gap:10px}
.picker-btn .nm{flex:1;min-width:0;font-size:15px}
.picker-btn .nm.ph{color:var(--ink-3)}
.picker-btn .nm small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
.picker-btn .ch{color:var(--ink-3);font-size:12px}
#pkSearch{width:100%;padding:13px 14px;border:1.5px solid var(--primary);border-radius:var(--r);
  font-size:16px;margin-bottom:10px;background:var(--surface)}
#pkList{max-height:46dvh;overflow:auto;margin:0 -4px}
.pk-row{width:100%;display:flex;align-items:center;gap:11px;padding:11px 10px;
  border-radius:10px;text-align:left}
.pk-row:active{background:var(--bg)}
.pk-row .av{width:34px;height:34px;border-radius:50%;background:#EEF3FF;color:var(--primary);
  font-size:13px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.pk-row .b{flex:1;min-width:0}
.pk-row .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-row .s{font-size:11.5px;color:var(--ink-3)}
.pk-row.unknown .av{background:var(--warn-bg);color:var(--warn)}
.pk-empty{text-align:center;padding:26px 10px;color:var(--ink-3);font-size:13px}


/* ── ตารางห้องประชุม 08:00–18:00 ─────────────────────────────── */
.gridwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gridscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ghead{display:flex;position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.ghead .hcell{flex:0 0 84px;padding:8px 5px;text-align:center;border-left:1px solid var(--line)}
.ghead .hcell .n{font-size:11.5px;font-weight:800;line-height:1.25}
.ghead .hcell .c{font-size:9.5px;color:var(--ink-3);font-weight:600}
.ghead .corner{flex:0 0 34px}
.gbody{display:flex;position:relative}
.ghours{flex:0 0 34px}
.ghours span{display:block;height:44px;font-size:9.5px;color:var(--ink-3);font-weight:700;
  text-align:right;padding-right:4px;transform:translateY(-5px)}
.gcol{flex:0 0 84px;position:relative;border-left:1px solid var(--line)}
.gcol .hr{height:44px;border-bottom:1px dashed var(--line)}
.gcol .hr:active{background:var(--bk-bg,#EEF3FF)}
.gev{position:absolute;left:2px;right:2px;border-radius:7px;padding:4px 5px;
  background:var(--primary);color:#fff;overflow:hidden;text-align:left}
.gev.mine{background:var(--ok)}
.gev.unb{background:var(--bad)}
/* แถบเลือกวัน/คัน — เดิมเรียกคลาสนี้อยู่แต่ไม่เคยประกาศ เลยออกมาเป็นข้อความเปล่าๆ */
.chips{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:1px 0 3px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-2);
  white-space:nowrap;line-height:1.25;text-align:center}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip .d{display:block;font-size:14.5px;font-weight:800;line-height:1.15}
.mini{padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  font-size:11.5px;font-weight:700;color:var(--ink-2)}
.mini.call{border-color:var(--primary);color:var(--primary)}
.times{display:flex;align-items:center;gap:8px;margin-top:4px}
.tbox{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:9px 6px;
  background:#fff;text-align:center}
.tbox.hl{border-color:var(--primary);background:#F5F8FF}
.tbox .k{font-size:10.5px;font-weight:700;color:var(--ink-3);margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{flex:0 0 auto;color:var(--ink-3);font-size:15px;font-weight:800}
.carleg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:9px;
  font-size:11px;color:var(--ink-2);font-weight:600}
.carleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gev.live{background:var(--warn)}
.gev .p{font-size:8.5px;opacity:.85;line-height:1.2}
.gev .t{font-size:9.5px;font-weight:800;line-height:1.2}
.gev .w{font-size:9px;opacity:.9;line-height:1.25;margin-top:1px}
.gnow{position:absolute;left:34px;right:0;height:2px;background:var(--bad);z-index:3}
.gnow::before{content:'';position:absolute;left:-3px;top:-3px;width:8px;height:8px;
  border-radius:50%;background:var(--bad)}
.seg2{display:flex;background:var(--neutral);border-radius:10px;padding:3px;margin-bottom:12px}
.seg2 button{flex:1;padding:8px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.seg2 button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rcard{display:flex;gap:11px;align-items:center;padding:11px;border:1px solid var(--line);
  border-radius:13px;background:var(--surface);margin-bottom:9px;width:100%;text-align:left}
.rphoto{width:74px;height:56px;border-radius:10px;object-fit:cover;background:var(--neutral);
  flex:0 0 auto;display:grid;place-items:center;color:var(--ink-3)}
.rphoto svg{width:26px;height:26px}

/* ── Consent / PDPA ────────────────────────────────────────── */
.legal{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;max-height:38dvh;overflow:auto;
  font-size:13px;line-height:1.75;color:var(--ink-2);
}
.legal h4{margin:14px 0 5px;font-size:13.5px;color:var(--ink);font-weight:700}

/* ── 4. API — คุยกับ Apps Script เดิม (ไม่ต้องรื้อ backend) ───── */
async function api(action, payload = {}, method = 'GET'){
  if(DEMO){
    await new Promise(r => setTimeout(r, 260));       // จำลองดีเลย์จริง จะได้เห็น skeleton
    return MOCK[action] ?? { ok:true };
  }
  if(!CFG.GAS_URL || CFG.GAS_URL.startsWith('PASTE_')) throw new Error('NO_CONFIG');
  const base = CFG.GAS_URL;
  const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const tm = ac ? setTimeout(() => ac.abort(), 20000) : null;
  let res;
  if(method === 'GET'){
    const q = new URLSearchParams({ action, uid:S.uid||'', _t:Date.now(), ...payload });
    res = await fetch(`${base}?${q}`, { method:'GET', redirect:'follow', cache:'no-store',
                                        signal: ac ? ac.signal : undefined });
  }else{
    // text/plain = simple request → ไม่มี CORS preflight ที่ Apps Script ตอบไม่ได้
    res = await fetch(base, {
      method:'POST', redirect:'follow',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, uid:S.uid, ...payload }),
      signal: ac ? ac.signal : undefined
    });
  }
  if(tm) clearTimeout(tm);
  const text = await res.text();
  try { return JSON.parse(text); }
  catch(e){
    // Apps Script คืน HTML แทน JSON ได้ในบางจังหวะ (cold start / หน้า redirect ของ Google)
    const err = new Error('BAD_RESPONSE');
    err.snippet = text.slice(0, 120);
    throw err;
  }
}

/* Apps Script ตื่นจากหลับ (cold start) ใช้เวลาได้หลายวินาที และบางครั้งคืน HTML
   → ลองซ้ำแบบถอยหลังเพิ่มทีละเท่า ก่อนจะยอมแพ้ */
async function apiRetry(action, payload, method, tries = 3){
  let last;
  for(let i = 0; i <= tries; i++){
    try{ return await api(action, payload, method); }
    catch(e){
      last = e;
      if(e.message === 'NO_CONFIG' || i === tries) break;
      await new Promise(r => setTimeout(r, 600 * Math.pow(2, i)));   // 0.6s → 1.2s → 2.4s
    }
  }
  throw last;
}

/* ── 6. ROUTER — เปลี่ยนหน้าทันที ไม่โหลดใหม่ ─────────────────── */
const ROUTES = {};
/* ผูกการเปลี่ยนหน้าเข้ากับประวัติเบราว์เซอร์
   ไม่ทำแบบนี้ ปุ่มย้อนกลับของมือถือจะเด้งออกจากแอปทันทีตั้งแต่หน้าแรก */
function go(name, params = {}, replace = false){
  if(replace){
    if(S.stack.length) S.stack[S.stack.length - 1] = { name, params };
    else S.stack.push({ name, params });
    try{ history.replaceState({ i:S.stack.length }, '', '#' + name); }catch(e){}
  }else{
    S.stack.push({ name, params });
    try{ history.pushState({ i:S.stack.length }, '', '#' + name); }catch(e){}
  }
  render(name, params);
}
function back(){
  if(S.stack.length > 1){ try{ history.back(); return; }catch(e){} }
  S.stack = []; go('home', {}, true);
}
window.addEventListener('popstate', () => {
  if(S.stack.length > 1){
    S.stack.pop();
    const prev = S.stack[S.stack.length - 1];
    render(prev.name, prev.params);
  }else{
    // อยู่หน้าแรกแล้วกดย้อนกลับ = ตั้งใจจะออกจริง ปล่อยให้ออกได้ตามปกติ
    render('home', {});
  }
});
$('#backBtn').onclick = back;

function paintNav(){
  document.querySelectorAll('[data-nav]').forEach(el => el.textContent = t(el.dataset.nav));
}
function chrome(name){
  paintNav();
  const isHome = name === 'home';
  // 'privacy' = หน้าเดียวกับ consent แต่เปิดจากโปรไฟล์ → ต้องมีปุ่มกลับและเมนูล่าง
  const isFull = ['register','otp','consent','gate','offline'].includes(name);
  $('#backBtn').hidden = isHome || isFull;
  $('#brand').hidden   = !isHome;
  $('#title').hidden   = isHome;
  $('#nav').hidden     = isFull;
  $('#bellBtn').hidden = isFull;
  // ปุ่มลอยโผล่เฉพาะหน้าที่เกี่ยวกับพัสดุและเมนูผู้ดูแลเท่านั้น
  // หน้าอื่น (โดยเฉพาะหน้าฉุกเฉิน) ห้ามมีอะไรมาบัง
  $('#fab').hidden = !S.isOfficer ||
                     !['my-parcels','unidentified','admin'].includes(name);
  document.querySelectorAll('.nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.go === name || (name === 'parcel-in' && b.dataset.go === 'my-parcels')));
}
let RENDER_SEQ = 0;
async function render(name, params){
  const seq = ++RENDER_SEQ;
  chrome(name);
  const fn = ROUTES[name] || ROUTES.home;
  $x('#main').innerHTML = `<div class="view">${skeleton(2)}</div>`;
  try{ await fn(params); }
  catch(e){
    if(seq !== RENDER_SEQ) return;   // ผู้ใช้เปลี่ยนหน้าไปแล้ว ไม่ต้องขึ้น error ของหน้าเก่า
    if(e.message === 'NO_CONFIG'){
      $x('#main').innerHTML = `<div class="view"><div class="note">${IC.info}<div><b>${t('noConfig')}</b><br>${t('noConfigBody')}</div></div></div>`;
    }else{
      errorScreen(e, () => render(name, params));
    }
  }
}

/** หน้าจอเวลาเชื่อมต่อไม่ได้ — ลองใหม่ได้ตรงนี้โดยไม่ต้องรีโหลดทั้งแอป
    และมีปุ่มทดสอบการเชื่อมต่อ เอาไว้ส่งข้อความ error ให้คนแก้ดู */
function errorScreen(e, retryFn){
  $x('#main').innerHTML = `<div class="view">
    <div class="empty">${IC.info}<h3>${esc(t('netErr'))}</h3><p>${esc(t('netErrHint'))}</p></div>
    <button class="btn primary" id="rt">${esc(t('retry'))}</button>
    <div style="height:9px"></div>
    <button class="btn ghost" id="dg">${esc(t('diag'))}</button>
    <pre id="dgOut" hidden style="margin-top:12px;padding:11px;background:var(--surface);
      border:1px solid var(--line);border-radius:12px;font-size:11px;
      white-space:pre-wrap;word-break:break-all;color:var(--ink-2)"></pre>
  </div>`;
  $('#rt').onclick = () => (retryFn ? retryFn() : location.reload());
  $('#dg').onclick = async () => {
    const box = $('#dgOut'); box.hidden = false; box.textContent = t('loading');
    let out = 'error: ' + (e?.message || e) + (e?.snippet ? '\nsnippet: ' + e.snippet : '') + '\n';
    out += 'uid: ' + (S.uid ? S.uid.slice(0,8) + '…' : '(none)') + '\n';
    out += 'liff: ' + (S.liffReady ? 'ok' : 'no') + '\n';
    try{
      const r = await api('ping', {}, 'GET');
      out += 'ping: ' + JSON.stringify(r);
    }catch(err){
      out += 'ping FAILED: ' + (err?.message || err) + (err?.snippet ? '\n' + err.snippet : '');
    }
    box.textContent = out;
  };
}

ROUTES['parcel-in'] = async () => {
  setTitle(t('inTitle'));
  $x('#main').innerHTML = `<div class="view">
    <label class="shot" id="shot">
      <input type="file" accept="image/*" capture="environment" id="file" hidden>
      <div class="ph">${IC.cam}<p>${esc(t('inShoot'))}</p>
        <p style="opacity:.7;font-weight:400;margin-top:4px">${esc(t('inShootSub'))}</p></div>
    </label>
    <div style="margin-top:14px" id="afterShot" hidden>
      <button class="btn soft" id="scanBtn">${esc(t('inScan'))}</button>
      <div class="field" style="margin-top:16px">
        <label>${esc(t('inRecipient'))}<span class="en">${esc(t('inRecipientEn'))}</span></label>
        <button class="picker-btn" id="rcp">
          <span class="nm ph" id="rcpNm">${esc(t('inPick'))}</span><span class="ch">▾</span>
        </button>
      </div>
      <div class="field">
        <label>${esc(t('inTracking'))}</label>
        <input id="trk" inputmode="latin" autocomplete="off" placeholder="TH01234567890">
      </div>
      <div class="sticky-cta"><button class="btn primary" id="saveBtn">${esc(t('inSave'))}</button></div>
    </div>
  </div>`;

  const fileEl = $('#file');
  $('#shot').onclick = e => { if(e.target.tagName !== 'INPUT') fileEl.click(); };
  fileEl.onchange = async () => {
    const f = fileEl.files[0]; if(!f) return;
    const im = await shrink2(f);
    S.draft.photo = im.full; S.draft.thumb = im.thumb;
    $x('#shot').innerHTML = `<img src="${im.full}" alt=""><span class="retake">${esc(t('inRetake'))}</span>`;
    $('#shot').onclick = () => fileEl.click();
    $('#afterShot').hidden = false;
  };

  // โหลดรายชื่อพนักงานล่วงหน้าตอนที่ผู้ใช้กำลังถ่ายรูป — พอเลื่อนลงมาจะพร้อมแล้ว
  if(!S.employees.length){
    try{ const r = await cached('emp', 6e5, () => apiRetry('getEmployees', {}, 'GET'));
         S.employees = r?.items || []; }catch(e){}
  }

  let chosen = null, isUnknown = false;
  const nmEl = $('#rcpNm'), saveBtn = $('#saveBtn');
  $('#rcp').onclick = async () => {
    const pick = await pickPerson();
    if(!pick) return;
    if(pick.unknown){
      isUnknown = true; chosen = null;
      nmEl.className = 'nm'; nmEl.textContent = t('inUnknown');
      saveBtn.textContent = t('inSaveUnknown');
    }else{
      isUnknown = false; chosen = pick;
      nmEl.className = 'nm';
      nmEl.innerHTML = `${esc(pick.name_th || pick.name_en)}` +
        (pick.department ? `<small>${esc(pick.department)}</small>` : '');
      saveBtn.textContent = t('inSave');
    }
  };

  $('#scanBtn').onclick = async () => {
    const b = $('#scanBtn'); b.disabled = true; b.textContent = t('inScanning');
    try{
      const r = await apiRetry('scanParcelPhoto', { photo:S.draft.photo }, 'POST');
      if(r?.trackingNo) $('#trk').value = r.trackingNo;
      const guess = (r?.recipientName || '').trim();
      let matched = null;
      if(guess){
        const n = s => String(s || '').toLowerCase().replace(/\s|\./g, '');
        const g = n(guess);
        matched = S.employees.find(p => n(p.name_th) === g || n(p.nickname) === g)
               || S.employees.find(p => g.includes(n(p.nickname)) && n(p.nickname).length > 1)
               || S.employees.find(p => n(p.name_th).includes(g) && g.length > 2);
      }
      if(matched){
        // AI เดาให้ แต่ยังต้องให้คนกดยืนยันเสมอ — แจ้งผิดคนเสียความเชื่อมั่นกว่าที่คิด
        chosen = matched; isUnknown = false;
        nmEl.className = 'nm';
        nmEl.innerHTML = `${esc(matched.name_th || matched.name_en)}` +
          (matched.department ? `<small>${esc(matched.department)}</small>` : '');
        saveBtn.textContent = t('inSave');
      }
      toast(matched ? t('inScanOk') : t('inScanFail'), matched ? 'ok' : '');
    }catch(e){ toast(t('inScanFail')); }
    b.disabled = false; b.textContent = t('inScan');
  };

  saveBtn.onclick = async () => {
    if(!S.draft.photo){ toast(t('inNeedPhoto'), 'bad'); return; }
    const unknown = isUnknown || !chosen;
    const btn = saveBtn; btn.disabled = true;
    try{
      await apiRetry('logParcel', {
        photo:S.draft.photo,
        thumb:S.draft.thumb,
        recipient_id: unknown ? '' : chosen.kenan_user_id,
        recipient_name: unknown ? '' : (chosen.name_th || chosen.name_en || ''),
        tracking_no: $('#trk').value.trim()
      }, 'POST');
      S.draft = { photo:null, thumb:null, scan:null, recipient:null, tracking:'' };
      toast(unknown ? t('inDoneUnknown') : t('inDone'), 'ok');
      go('parcel-in', {}, true);   // พร้อมถ่ายชิ้นถัดไปทันที ไม่ต้องกดกลับ
    }catch(e){ toast(t('netErr'), 'bad'); btn.disabled = false; }
  };
};

ROUTES['admin-roles'] = async () => {

  let users = [];
  try{ const r = await apiRetry('getUsersForAdmin', {}, 'GET'); users = r?.items || []; }catch(e){}

  const badge = u => {
    const r = String(u.roles || 'staff');
    if(u.is_super)            return `<span class="pill new">${esc(t('roleSuper'))}</span>`;
    if(r.includes('admin'))   return `<span class="pill new">${esc(t('roleAdmin'))}</span>`;
    if(r.includes('officer')) return `<span class="pill wait">${esc(t('roleOfficer'))}</span>`;
    return `<span class="pill" style="background:var(--neutral);color:var(--ink-3)">${esc(t('roleStaff'))}</span>`;
  };
  const paint = kw => {
    const k = String(kw || '').toLowerCase();
    const hits = users.filter(u => !k ||
      String(u.name_th).toLowerCase().includes(k) ||
      String(u.nickname).toLowerCase().includes(k) ||
      String(u.email).toLowerCase().includes(k));
    $x('#ulist').innerHTML = `<div class="rows">${hits.map(u => `
      <button class="row" data-id="${esc(u.kenan_user_id)}" ${u.is_super ? 'disabled style="opacity:.6"' : ''}>

        <div class="body">
          <div class="t">${esc(u.name_th)}${u.nickname ? ' · ' + esc(u.nickname) : ''}</div>
          <div class="s">${esc(u.email)}</div>
        </div>${badge(u)}
      </button>`).join('')}</div>`;
    document.querySelectorAll('#ulist .row:not([disabled])').forEach(b =>
      b.onclick = () => roleSheet(users.find(x => x.kenan_user_id === b.dataset.id)));
  };
  paint('');
  $('#rq').oninput = e => paint(e.target.value);

  function roleSheet(u){
    const cur = String(u.roles || 'staff');
    const lvl = cur.includes('admin') ? 'admin' : cur.includes('officer') ? 'officer' : 'staff';
    const opt = (v, th, sub) => `
      <button class="row" data-r="${v}" style="border-radius:12px;border:1.5px solid ${
        v === lvl ? 'var(--primary)' : 'var(--line)'};margin-bottom:8px;background:${
        v === lvl ? 'var(--bk-bg,#EEF3FF)' : '#fff'}">
        <div class="body"><div class="t">${esc(th)}</div><div class="s">${esc(sub)}</div></div>
        ${v === lvl ? '<span style="color:var(--primary);font-weight:800">✓</span>' : ''}
      </button>`;
    sheet(`<h3>${esc(u.name_th)}</h3><p class="sub">${esc(u.email)}</p>
      ${opt('staff',   t('roleStaff'),   t('roleStaffSub'))}
      ${opt('officer', t('roleOfficer'), t('roleOfficerSub'))}
      ${opt('admin',   t('roleAdmin'),   t('roleAdminSub'))}
      <button class="btn ghost" id="cx" style="margin-top:6px">${esc(t('cancel'))}</button>`);
    $('#cx').onclick = closeSheet;
    document.querySelectorAll('#sheetBody .row[data-r]').forEach(b => b.onclick = async () => {
      const roles = b.dataset.r === 'admin'   ? 'staff,officer,admin'
                  : b.dataset.r === 'officer' ? 'staff,officer' : 'staff';
      closeSheet();
      try{
        await apiRetry('setUserRoles', { target_id:u.kenan_user_id, roles }, 'POST');
        u.roles = roles; toast(t('roleSaved'), 'ok'); paint($('#rq').value);
      }catch(e){ toast(t('netErr'), 'bad'); }

};

      <div class="section-title">${esc(d)}</div>

      const p = people.find(x => x.kenan_user_id === b.dataset.id); if(!p) return;
      sheet(`<h3>${esc(p.name_th || p.name_en)}${p.nickname ? ' · ' + esc(p.nickname) : ''}</h3>

            style="text-decoration:none">📞 ${esc(t('dirCall'))} ${esc(p.phone)}</a>` : ''}

/* ── ห้องประชุม ─────────────────────────────────────────────── */
const dayKey = d => {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
};
const hhmm = iso => { try{ return new Date(iso).toLocaleTimeString(
  S.lang==='th'?'th-TH':'en-GB',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };
const H0 = 8, H1 = 18, HPX = 44;            // ตาราง 08:00–18:00 ช่องละ 44px
const minsFrom8 = iso => { const d = new Date(iso); return (d.getHours()-H0)*60 + d.getMinutes(); };
/* ในช่องแคบๆ ของตาราง เวลาเริ่มกับชื่อเต็มอ่านไม่ทัน
   บอก "ยาวแค่ไหน" กับ "ใคร" พอ — เวลาเริ่มดูได้จากตำแหน่งของบล็อกอยู่แล้ว */
const durLabel = (s, e) => {
  const m = Math.round((Date.parse(e) - Date.parse(s)) / 60000);
  if(m < 60) return m + (S.lang==='th' ? ' น.' : 'm');
  const hh = Math.floor(m/60), mm = m%60;
  return hh + (mm ? '.' + Math.round(mm/6) : '') + (S.lang==='th' ? ' ชม.' : ' hr');
};
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';

ROUTES.rooms = async (params = {}) => {
  setTitle(t('rmTitle'));
  const base = new Date(); const days = [];
  for(let i = 0; i < 14; i++){ const d = new Date(base); d.setDate(base.getDate()+i); days.push(d); }
  const sel  = params.date || dayKey(base);
  const mode = params.mode || 'day';        // day = ทุกห้องวันเดียว · week = ห้องเดียว 7 วัน

  $x('#main').innerHTML = `<div class="view">
    <div class="seg2" id="sg">
      <button class="${mode==='day'?'on':''}" data-m="day">${esc(t('rmDay'))}</button>
      <button class="${mode==='week'?'on':''}" data-m="week">${esc(t('rmWeek'))}</button>
    </div>
    <div id="ctl"></div>
    <div id="rl">${skeleton(3)}</div>
    <div class="section-title">${esc(t('rmPick'))}</div>
    <div id="rooms"></div>
    <div class="sticky-cta"><button class="btn primary" id="bk">＋ ${esc(t('rmBook'))}</button></div>
  </div>`;
  $('#bk').onclick = () => go('room-new', { date:sel });
  document.querySelectorAll('#sg button').forEach(b =>
    b.onclick = () => go('rooms', { date:sel, mode:b.dataset.m }, true));

  let r = null;
  try{ r = await apiRetry('getRoomDay',
        { date: mode==='week' ? sel : sel, days: mode==='week' ? 7 : 1 }, 'GET'); }catch(e){}
  if(!r?.ok){ $x('#rl').innerHTML = emptyState(IC.info, t('netErr'), ''); return; }

  let room0 = params.room || r.rooms[0]?.resource_id;

  // ── แถบควบคุมด้านบน
  $x('#ctl').innerHTML = mode === 'day'
    ? `<div class="chips" id="dch" style="margin-bottom:11px">${days.slice(0,10).map(d => `
        <button class="chip ${dayKey(d)===sel?'on':''}" data-d="${dayKey(d)}">
          ${d.toLocaleDateString(S.lang==='th'?'th-TH':'en-GB',{weekday:'short'})}
          <span class="d">${d.getDate()}</span></button>`).join('')}</div>`
    : `<div class="chips" id="rch" style="margin-bottom:11px">${r.rooms.map(rm => `
        <button class="chip ${rm.resource_id===room0?'on':''}" data-r="${esc(rm.resource_id)}">
          ${esc(rm.name_th.replace('ห้อง ',''))}</button>`).join('')}</div>`;
  if($('#dch')) document.querySelectorAll('#dch .chip').forEach(c =>
    c.onclick = () => go('rooms', { date:c.dataset.d, mode }, true));
  if($('#rch')) document.querySelectorAll('#rch .chip').forEach(c =>
    c.onclick = () => go('rooms', { date:sel, mode, room:c.dataset.r }, true));

  // ── ตาราง
  const cols = mode === 'day'
    ? r.rooms.map(rm => ({ key:rm.resource_id, n:rm.name_th.replace('ห้อง ',''),
                           c: rm.capacity ? t('rmSeats')(rm.capacity) : '' }))
    : days.slice(0,7).map(d => ({ key:dayKey(d),
        n:d.toLocaleDateString(S.lang==='th'?'th-TH':'en-GB',{weekday:'short'}), c:String(d.getDate()) }));

  const evFor = col => r.bookings.filter(b =>
    mode === 'day' ? b.resource_id === col.key
                   : (b.resource_id === room0 && dayKey(b.start_at) === col.key));

  const nowTop = (() => {
    const n = new Date();
    if(dayKey(n) !== sel && mode === 'day') return null;
    const m = (n.getHours()-H0)*60 + n.getMinutes();
    return (m < 0 || m > (H1-H0)*60) ? null : (m/60)*HPX;
  })();

  $x('#rl').innerHTML = `<div class="gridwrap"><div class="gridscroll"><div style="min-width:${34+cols.length*84}px">
    <div class="ghead"><div class="corner"></div>${cols.map(c => `
      <div class="hcell"><div class="n">${esc(c.n)}</div><div class="c">${esc(c.c)}</div></div>`).join('')}</div>
    <div class="gbody">
      <div class="ghours">${Array.from({length:H1-H0+1},(_,i)=>`<span>${String(H0+i).padStart(2,'0')}</span>`).join('')}</div>
      ${cols.map(c => `<div class="gcol" data-k="${esc(c.key)}">
        ${Array.from({length:H1-H0},(_,i)=>`<div class="hr" data-h="${H0+i}"></div>`).join('')}
        ${evFor(c).map(b => {
          const top = Math.max(0,(minsFrom8(b.start_at)/60)*HPX);
          const hgt = Math.max(20,((minsFrom8(b.end_at)-minsFrom8(b.start_at))/60)*HPX-2);
          const mine = String(b.requester_id) === String(S.me?.kenan_user_id);
          return `<button class="gev ${mine?'mine':''}" data-b="${esc(b.record_id)}"
            style="top:${top}px;height:${hgt}px">
            <div class="t">${esc(durLabel(b.start_at, b.end_at))}</div>
            <div class="w">${esc(firstName(b.who))}</div></button>`;
        }).join('')}
      </div>`).join('')}
      ${nowTop!==null?`<div class="gnow" style="top:${nowTop}px"></div>`:''}
    </div>
  </div></div></div>
  <div style="font-size:11.5px;color:var(--ink-3);margin-top:8px;text-align:center">${esc(t('rmTapSlot'))}</div>`;

  // แตะช่องว่าง = จองเลย · แตะรายการที่มีอยู่ = ดูว่าใครจอง (ขอสลับได้)
  document.querySelectorAll('#rl .hr').forEach(cell => cell.onclick = () => {
    const key = cell.closest('.gcol').dataset.k, hr = cell.dataset.h;
    go('room-new', mode==='day' ? { date:sel, room:key, hour:hr }
                                : { date:key, room:room0, hour:hr });
  });
  document.querySelectorAll('#rl .gev').forEach(el => el.onclick = ev => {
    ev.stopPropagation();
    const b = r.bookings.find(x => x.record_id === el.dataset.b); if(!b) return;
    const mine = String(b.requester_id) === String(S.me?.kenan_user_id);
    const rm = r.rooms.find(x => x.resource_id === b.resource_id);
    sheet(`<h3>${esc(b.title)}</h3>
      <p class="sub">${esc(rm?.name_th || '')} · ${esc(fmtDate(b.start_at))} – ${esc(hhmm(b.end_at))}</p>
      <div class="rows" style="margin-bottom:12px"><div class="row">
        <span class="av">${esc(String(b.who||'?').trim().charAt(0))}</span>
        <div class="body"><div class="t">${esc(b.who)}</div>
          <div class="s">${esc(b.who_dept || '')}</div></div></div></div>
      ${mine ? `<button class="btn danger" id="cx2" style="background:var(--bad);color:#fff">${esc(t('rmCancel'))}</button>`
        : `<div class="note info">${IC.info}<div>${esc(t('rmSwapHint'))}</div></div>
           ${b.who_phone?`<a class="btn primary" href="tel:${esc(b.who_phone)}" style="text-decoration:none;margin-top:10px">📞 ${esc(b.who_phone)}</a>`:''}
           ${b.who_email?`<a class="btn ghost" href="mailto:${esc(b.who_email)}" style="text-decoration:none;word-break:break-all">✉ ${esc(b.who_email)}</a>`:''}`}
      <button class="btn ghost" id="cl">${esc(t('close'))}</button>`);
    $('#cl').onclick = closeSheet;
    if($('#cx2')) $('#cx2').onclick = async () => {
      closeSheet();
      try{ await apiRetry('cancelRoomBooking', { record_id:b.record_id }, 'POST');
           toast(t('rmCancelled'),'ok'); go('rooms', { date:sel, mode }, true); }
      catch(e){ toast(t('netErr'),'bad'); }
    };
  });

  // ── การ์ดห้อง: รูป + จำนวนที่นั่ง
  $x('#rooms').innerHTML = r.rooms.map(rm => `
    <button class="rcard" data-r="${esc(rm.resource_id)}">
      ${rm.thumb_id ? `<img class="rphoto" data-ph="${esc(rm.thumb_id)}" alt="">`
                    : `<div class="rphoto">${IC.cal}</div>`}
      <div style="flex:1;min-width:0">
        <div style="font-size:14.5px;font-weight:700">${esc(rm.name_th)}</div>
        <div style="font-size:11.5px;color:var(--ink-3)">${
          esc([rm.capacity ? t('rmSeats')(rm.capacity) : '', rm.category, rm.note].filter(Boolean).join(' · '))}</div>
      </div><span class="go">${IC.chev}</span>
    </button>`).join('');
  paintPhotos($('#rooms'));
  document.querySelectorAll('#rooms .rcard').forEach(b =>
    b.onclick = () => go('room-new', { date:sel, room:b.dataset.r }));
};

  const day = date || dayKey(new Date());
  const h1  = hour ? String(hour).padStart(2,'0') + ':00' : '09:00';
  const h2  = hour ? String(Math.min(Number(hour)+1,18)).padStart(2,'0') + ':00' : '10:00';
  let rooms = [];
  try{ const r = await apiRetry('getRoomDay', { date:day }, 'GET'); rooms = r?.rooms || []; }catch(e){}

  $x('#main').innerHTML = `<div class="view">
    <div class="card">
      <div style="font-size:13px;font-weight:600;margin-bottom:9px">${esc(t('rmPick'))}</div>
      <div id="rp">${rooms.map((rm, i) => `
        <button class="row" data-v="${esc(rm.resource_id)}" style="border:1.5px solid ${
          (preRoom?rm.resource_id===preRoom:i===0)?'var(--primary)':'var(--line)'};border-radius:12px;
          margin-bottom:8px;background:${(preRoom?rm.resource_id===preRoom:i===0)?'#EEF3FF':'#fff'}">
          ${rm.thumb_id ? `<img class="rphoto" style="width:52px;height:40px" data-ph="${esc(rm.thumb_id)}" alt="">`
                        : `<div class="rphoto" style="width:52px;height:40px">${IC.cal}</div>`}
          <div class="body"><div class="t">${esc(rm.name_th)}</div>
            <div class="s">${esc([rm.capacity?t('rmSeats')(rm.capacity):'', rm.note].filter(Boolean).join(' · '))}</div></div>
          <span class="ck" style="color:var(--primary);font-weight:800;${
            (preRoom?rm.resource_id===preRoom:i===0)?'':'visibility:hidden'}">✓</span>
        </button>`).join('')}</div>
    </div>
    <div class="card">
      <div class="field"><label>${esc(t('rmWhen'))}</label>
        <input type="date" id="dd" value="${day}"></div>
      <div class="times">
        <div class="tbox"><div class="k">${esc(t('rmFrom'))}</div>
          <input type="time" id="t1" value="${h1}" style="border:none;font-size:17px;font-weight:800;
            text-align:center;width:100%;background:transparent"></div>
        <div class="arrow">→</div>
        <div class="tbox hl"><div class="k">${esc(t('rmTo'))}</div>
          <input type="time" id="t2" value="${h2}" style="border:none;font-size:17px;font-weight:800;
            text-align:center;width:100%;background:transparent"></div>
      </div>
    </div>
    <div class="card">
      <div class="field" style="margin:0"><label>${esc(t('rmSubject'))}<span class="req">*</span></label>
        <input id="ti" placeholder="${esc(t('rmSubjectPh'))}"></div>
    </div>
    <div class="note info">${IC.info}<div>${esc(t('rmIcsHint'))}</div></div>
    <div class="sticky-cta"><button class="btn primary" id="go">${esc(t('rmGo'))}</button></div>
  </div>`;

  let room = preRoom || rooms[0]?.resource_id || '';
  paintPhotos($('#rp'));
  document.querySelectorAll('#rp .row').forEach(b => b.onclick = () => {
    room = b.dataset.v;
    document.querySelectorAll('#rp .row').forEach(x => {
      const on = x === b;
      x.style.borderColor = on ? 'var(--primary)' : 'var(--line)';
      x.style.background  = on ? '#EEF3FF' : '#fff';
      x.querySelector('.ck').style.visibility = on ? 'visible' : 'hidden';
    });
  });
  $('#go').onclick = async () => {
    const title = $('#ti').value.trim();
    if(!title){ toast(t('admNeedTitle'), 'bad'); return; }
    const d = $('#dd').value, a = $('#t1').value, z = $('#t2').value;
    if(!d || !a || !z){ toast(t('rmBadTime'), 'bad'); return; }
    if(z <= a){ toast(t('rmBadTime'), 'bad'); return; }
    const b = $('#go'); b.disabled = true;
    try{
      const r = await apiRetry('createRoomBooking', {
        resource_id:room, title,
        start_at:`${d}T${a}:00+07:00`, end_at:`${d}T${z}:00+07:00`
      }, 'POST');
      if(r?.error === 'CLASH'){
        toast(`${t('rmClash')} · ${r.clash?.who || ''}`, 'bad');
        b.disabled = false; return;
      }
      if(r?.ok === false) throw 0;
      toast(t('rmOk'), 'ok');
      S.stack = [{ name:'home', params:{} }]; go('rooms', { date:d });
    }catch(e){ toast(t('netErr'), 'bad'); b.disabled = false; }
  };
};

function wirePhoto(id, store){
  const el = document.getElementById(id);
  const box = document.getElementById(id + 's');
  box.onclick = e => { if(e.target.tagName !== 'INPUT') el.click(); };
  el.onchange = async () => {

    const im = await shrink2(f); store.v = im;
    box.innerHTML = `<img src="${im.full}" alt=""><span class="retake">${esc(t('inRetake'))}</span>`;
    box.onclick = () => el.click();
  };
}

ROUTES.cars = async (params = {}) => {

  const today = new Date();
  const sel   = params.date || dayKey(today);
  const mode  = params.mode || 'day';
  const dchips = Array.from({length:14}, (_,i) => { const d = new Date(today); d.setDate(today.getDate()+i); return d; });
  const wdays  = Array.from({length:7},  (_,i) => { const d = new Date(sel + 'T00:00:00'); d.setDate(d.getDate()+i); return d; });

  $x('#main').innerHTML = `<div class="view">
    <div id="dbn"></div>
    <div class="seg2" id="sg">
      <button class="${mode==='day'?'on':''}" data-m="day">${esc(t('rmDay'))}</button>
      <button class="${mode==='week'?'on':''}" data-m="week">${esc(t('rmWeek'))}</button>
    </div>
    <div id="ctl"></div>
    <div id="gr">${skeleton(3)}</div>
    <div class="section-title">${esc(t('carPickVeh'))}</div>
    <div id="vl"></div>
    <div class="sticky-cta"><button class="btn primary" id="bk">＋ ${esc(t('carBook'))}</button></div>
  </div>`;
  $('#bk').onclick = () => go('car-new', { date:sel });
  document.querySelectorAll('#sg button').forEach(b =>
    b.onclick = () => go('cars', { date:sel, mode:b.dataset.m }, true));

  let r = null;
  try{ r = await apiRetry('getCarDay', { date:sel, days: mode==='week' ? 7 : 1 }, 'GET'); }catch(e){}
  if(!r?.ok){ $x('#gr').innerHTML = emptyState(IC.info, t('netErr'), ''); return; }

  if(!r.vehicles.length){
    $x('#gr').innerHTML = emptyState(IC.car, t('carEmpty'), t('carEmptyBody'));
    $x('#vl').innerHTML = ''; return;
  }

  const me   = String(S.me?.kenan_user_id || '');
  let   veh0 = params.veh || r.vehicles[0]?.resource_id;

  /* คนขับเห็นทางเข้างานของตัวเองก่อนอย่างอื่น ไม่ต้องไปหาในเมนู */
  if(r.isDriver){
    const mine = r.trips.filter(x => String(x.driver_id) === me &&
                                     ['assigned','requested','in_use'].includes(x.status));
    $x('#dbn').innerHTML = `<button class="row" id="dgo" style="border:1.5px solid var(--primary);
        border-radius:14px;background:#EEF3FF;margin-bottom:12px;width:100%">

        <div class="body"><div class="t">${esc(t('drvOpen'))}</div>
          <div class="s">${esc(mine.length ? t('drvJobs')(mine.length) : t('drvNone'))}</div></div>
        <span class="go">${IC.chev}</span></button>`;
    $('#dgo').onclick = () => go('driver');
  }

  /* ── แถบเลือกวัน / เลือกคัน */
  $x('#ctl').innerHTML = mode === 'day'
    ? `<div class="chips" id="dch" style="margin-bottom:11px">${dchips.slice(0,10).map(d => `
        <button class="chip ${dayKey(d)===sel?'on':''}" data-d="${dayKey(d)}">
          ${d.toLocaleDateString(S.lang==='th'?'th-TH':'en-GB',{weekday:'short'})}
          <span class="d">${d.getDate()}</span></button>`).join('')}</div>`
    : `<div class="chips" id="vch" style="margin-bottom:11px">${r.vehicles.map(v => `
        <button class="chip ${v.resource_id===veh0?'on':''}" data-v="${esc(v.resource_id)}">
          ${esc(v.name_th)}</button>`).join('')}</div>`;
  if($('#dch')) document.querySelectorAll('#dch .chip').forEach(c =>
    c.onclick = () => go('cars', { date:c.dataset.d, mode }, true));
  if($('#vch')) document.querySelectorAll('#vch .chip').forEach(c =>
    c.onclick = () => go('cars', { date:sel, mode, veh:c.dataset.v }, true));

  /* ── ตาราง 08:00–18:00 */
  const cols = mode === 'day'
    ? r.vehicles.map(v => ({ key:v.resource_id, n:v.name_th,
        c: v.driver_name ? firstName(v.driver_name) : (v.capacity ? t('rmSeats')(v.capacity) : '') }))
    : wdays.map(d => ({ key:dayKey(d),
        n:d.toLocaleDateString(S.lang==='th'?'th-TH':'en-GB',{weekday:'short'}), c:String(d.getDate()) }));

  const evFor = col => r.trips.filter(x => mode === 'day'
    ? x.resource_id === col.key
    : (x.resource_id === veh0 && dayKey(x.start_at) === col.key));

  const nowTop = (() => {
    const n = new Date();
    if(mode === 'day' && dayKey(n) !== sel) return null;
    const m = (n.getHours()-H0)*60 + n.getMinutes();
    return (m < 0 || m > (H1-H0)*60) ? null : (m/60)*HPX;
  })();

  $x('#gr').innerHTML = `<div class="gridwrap"><div class="gridscroll"><div style="min-width:${34+cols.length*84}px">
    <div class="ghead"><div class="corner"></div>${cols.map(c => `
      <div class="hcell"><div class="n">${esc(c.n)}</div><div class="c">${esc(c.c)}</div></div>`).join('')}</div>
    <div class="gbody">
      <div class="ghours">${Array.from({length:H1-H0+1},(_,i)=>`<span>${String(H0+i).padStart(2,'0')}</span>`).join('')}</div>
      ${cols.map(c => `<div class="gcol" data-k="${esc(c.key)}">
        ${Array.from({length:H1-H0},(_,i)=>`<div class="hr" data-h="${H0+i}"></div>`).join('')}
        ${evFor(c).map(x => {
          const s = x.started_at || x.start_at, e = x.finished_at || x.end_at;
          const top = Math.max(0,(minsFrom8(s)/60)*HPX);
          const hgt = Math.max(20,((minsFrom8(e)-minsFrom8(s))/60)*HPX-2);
          const cls = x.unbooked ? 'unb' : (x.status === 'in_use' ? 'live'
                    : (String(x.requester_id) === me ? 'mine' : ''));
          return `<button class="gev ${cls}" data-b="${esc(x.record_id)}" style="top:${top}px;height:${hgt}px">
            <div class="t">${esc(durLabel(s, e))}</div>
            <div class="w">${esc(firstName(x.who) || firstName(x.driver))}</div>
            ${hgt > 40 && x.project_code ? `<div class="p">${esc(x.project_code)}</div>` : ''}</button>`;
        }).join('')}
      </div>`).join('')}
      ${nowTop!==null?`<div class="gnow" style="top:${nowTop}px"></div>`:''}
    </div>
  </div></div></div>
  <div class="carleg">
    <span><i style="background:var(--ok)"></i>${esc(t('carLegMine'))}</span>
    <span><i style="background:var(--warn)"></i>${esc(carStName('in_use'))}</span>
    <span><i style="background:var(--bad)"></i>${esc(t('carUnbooked'))}</span>
  </div>
  <div style="font-size:11.5px;color:var(--ink-3);margin-top:6px;text-align:center">${esc(t('carTapSlot'))}</div>`;

  document.querySelectorAll('#gr .hr').forEach(cell => cell.onclick = () => {
    const key = cell.closest('.gcol').dataset.k, hr = cell.dataset.h;
    go('car-new', mode==='day' ? { date:sel, veh:key, hour:hr } : { date:key, veh:veh0, hour:hr });
  });
  document.querySelectorAll('#gr .gev').forEach(el => el.onclick = ev => {
    ev.stopPropagation();
    const x = r.trips.find(y => y.record_id === el.dataset.b); if(!x) return;
    tripSheet(x, r, () => go('cars', { date:sel, mode, veh:veh0 }, true));
  });

  /* ── การ์ดรถ: รูป · ที่นั่ง · คนขับประจำ · ใช้งานวันนี้กี่เที่ยว */
  $x('#vl').innerHTML = r.vehicles.map(v => {
    const n = r.trips.filter(x => x.resource_id === v.resource_id).length;
    const live = r.trips.some(x => x.resource_id === v.resource_id && x.status === 'in_use');
    return `<button class="rcard" data-v="${esc(v.resource_id)}">
      ${v.thumb_id ? `<img class="rphoto" data-ph="${esc(v.thumb_id)}" alt="">`
                   : `<div class="rphoto">${IC.car}</div>`}
      <div style="flex:1;min-width:0">
        <div style="font-size:14.5px;font-weight:700">${esc(v.name_th)}</div>
        <div style="font-size:11.5px;color:var(--ink-3)">${esc([
          v.capacity ? t('rmSeats')(v.capacity) : '',
          v.driver_name ? t('carDriver') + ' ' + v.driver_name : t('carNoDriver'),
          v.note ].filter(Boolean).join(' · '))}</div>
        ${live ? `<div style="font-size:10.5px;font-weight:800;color:var(--warn);margin-top:2px">● ${esc(carStName('in_use'))}</div>`
               : (n ? `<div style="font-size:10.5px;color:var(--ink-3);margin-top:2px">${n} ${S.lang==='th'?'เที่ยว':'trips'}</div>` : '')}
      </div><span class="go">${IC.chev}</span></button>`;
  }).join('');
  paintPhotos($('#vl'));
  document.querySelectorAll('#vl .rcard').forEach(b =>
    b.onclick = () => go('car-new', { date:sel, veh:b.dataset.v }));
};

/** รายละเอียดเที่ยว — คนอื่นเห็นด้วยว่าใครจอง ไปไหน โครงการอะไร
    ความโปร่งใสตรงนี้คือสิ่งที่ทำให้การกั๊กรถลดลงเอง โดยไม่ต้องมีกฎ */
function tripSheet(x, r, refresh){
  const me   = String(S.me?.kenan_user_id || '');
  const mine = String(x.requester_id) === me;
  const veh  = r.vehicles.find(v => v.resource_id === x.resource_id);
  const stops = stopsOf(x);
  sheet(`<h3>${esc(x.title || '-')}</h3>
    <p class="sub">${esc(veh?.name_th || '')} · ${esc(fmtDate(x.start_at))}</p>
    ${x.unbooked ? `<div class="note" style="border-color:var(--bad);color:var(--bad)">${IC.info}
      <div>${esc(t('carUnbooked'))}</div></div>` : ''}
    <div class="rows" style="margin:10px 0">
      <div class="row"><div class="body">
        <div class="s">${esc(t('carBookedTime'))}</div>
        <div class="t">${esc(hhmm(x.start_at))} → ${esc(hhmm(x.end_at))}</div></div></div>
      ${x.started_at ? `<div class="row"><div class="body">
        <div class="s">${esc(t('carActualTime'))}</div>
        <div class="t">${esc(hhmm(x.started_at))} → ${x.finished_at ? esc(hhmm(x.finished_at)) : '…'}</div>
        </div></div>` : ''}
      <div class="row"><div class="body">
        <div class="s">${esc(t('rmBookedBy'))}</div>
        <div class="t">${esc(x.who || '-')}</div></div></div>
      ${x.driver ? `<div class="row"><div class="body">
        <div class="s">${esc(t('carDriver'))}</div>
        <div class="t">${esc(x.driver)}</div></div></div>` : ''}
      ${x.project_code ? `<div class="row"><div class="body">
        <div class="s">${esc(t('carProject'))}</div>
        <div class="t">${esc(x.project_code)}</div></div></div>` : ''}
      ${x.passengers ? `<div class="row"><div class="body">
        <div class="s">${esc(t('carPax'))}</div>
        <div class="t">${esc(x.passengers)}</div></div></div>` : ''}
    </div>
    ${stops.length ? `<div class="section-title" style="margin-top:4px">${esc(t('carStops'))}</div>
      <div class="rows" style="margin-bottom:12px">${stops.map((sp,i) => `
        <div class="row"><span class="av">${i+1}</span><div class="body">
          <div class="t">${esc(sp.place || '-')}</div>
          <div class="s">${esc(sp.project_code || '')}</div></div></div>`).join('')}</div>` : ''}
    <span class="pill new" style="margin-bottom:10px;display:inline-block">${esc(carStName(x.status))}</span>
    ${mine && x.status !== 'in_use'
      ? `<button class="btn" id="cx" style="background:var(--bad);color:#fff">${esc(t('carCancel'))}</button>`
      : (!mine ? `<div class="note info">${IC.info}<div>${esc(t('rmSwapHint'))}</div></div>` : '')}
    <button class="btn ghost" id="cl3">${esc(t('close'))}</button>`);
  $('#cl3').onclick = closeSheet;
  if($('#cx')) $('#cx').onclick = async () => {
    closeSheet();
    try{ await apiRetry('cancelCarBooking', { record_id:x.record_id }, 'POST');
         toast(t('carCancelled'),'ok'); refresh(); }
    catch(e){ toast(t('netErr'),'bad'); }
  };
}

ROUTES['car-new'] = async ({ date, veh:preVeh, hour } = {}) => {
  setTitle(t('carBook'));
  const day = date || dayKey(new Date());
  const h1  = hour ? String(hour).padStart(2,'0') + ':00' : '09:00';
  const h2  = hour ? String(Math.min(Number(hour)+3,18)).padStart(2,'0') + ':00' : '12:00';

  let r = null;
  try{ r = await apiRetry('getCarDay', { date:day }, 'GET'); }catch(e){}
  if(!r?.ok){ errorScreen(new Error('load'), () => render('car-new', { date, veh:preVeh, hour })); return; }
  if(!r.vehicles.length){
    $x('#main').innerHTML = `<div class="view">${emptyState(IC.car, t('carEmpty'), t('carEmptyBody'))}</div>`; return;
  }
  if(!r.projects.length){
    $x('#main').innerHTML = `<div class="view">${emptyState(IC.info, t('carProjNone'), t('carProjNoneBody'))}</div>`; return;
  }

  const projOpts = ph => `<option value="">${esc(ph)}</option>` + r.projects.map(p =>
    `<option value="${esc(p.code)}">${esc(p.code)} · ${esc(p.name || '')}</option>`).join('');

  $x('#main').innerHTML = `<div class="view">
    <div class="card">
      <div style="font-size:13px;font-weight:600;margin-bottom:9px">${esc(t('carPickVeh'))}</div>
      <div id="vp"></div>
      <div style="font-size:11px;color:var(--ink-3);margin-top:2px">${esc(t('carDriverAuto'))}</div>
      <div id="noFree"></div>
    </div>

    <div class="card">
      <div class="field"><label>${esc(t('rmWhen'))}</label><input type="date" id="dd" value="${day}"></div>
      <div class="times">
        <div class="tbox"><div class="k">${esc(t('carOut'))}</div>
          <input type="time" id="t1" value="${h1}" style="border:none;font-size:17px;font-weight:800;
            text-align:center;width:100%;background:transparent"></div>
        <div class="arrow">→</div>
        <div class="tbox hl"><div class="k">${esc(t('carBack'))}</div>
          <input type="time" id="t2" value="${h2}" style="border:none;font-size:17px;font-weight:800;
            text-align:center;width:100%;background:transparent"></div>
      </div>
      <div style="font-size:11px;color:var(--ink-3);margin-top:8px">${esc(t('carTimeHint'))}</div>
    </div>

    <div class="card">
      <div class="field"><label>${esc(t('carPurpose'))}<span class="req">*</span></label>
        <input id="pp" placeholder="${esc(t('carPurposePh'))}"></div>
      <div class="field" style="margin:0"><label>${esc(t('carProject'))}<span class="req">*</span></label>
        <select id="pj">${projOpts(t('carProjectPh'))}</select></div>
      <div style="font-size:11px;color:var(--ink-3);margin-top:6px">${esc(t('carProjWhy'))}</div>
    </div>

    <div class="card">
      <div style="font-size:13px;font-weight:600;margin-bottom:4px">${esc(t('carStops'))}</div>
      <div style="font-size:11px;color:var(--ink-3);margin-bottom:9px">${esc(t('carStopsHint'))}</div>
      <div id="st"></div>
      <button class="btn ghost" id="addStop" style="margin-top:6px">${esc(t('carAddStop'))}</button>
      <div id="split" style="font-size:11.5px;font-weight:700;color:var(--primary);margin-top:9px"></div>
    </div>

    <div class="card">
      <div class="field" style="margin:0"><label>${esc(t('carPax'))}</label>
        <input id="px" placeholder="${esc(t('carPaxPh'))}"></div>
    </div>

    <div class="sticky-cta"><button class="btn primary" id="goBk">${esc(t('carGo'))}</button></div>
  </div>`;

  /* ── รายการรถ + บอกว่าคันไหนว่างในช่วงเวลาที่เลือก */
  let vehId = preVeh || r.vehicles[0].resource_id;
  const overlap = (a1,a2,b1,b2) => Date.parse(a1) < Date.parse(b2) && Date.parse(b1) < Date.parse(a2);
  const win = () => {
    const d = $('#dd').value || day, a = $('#t1').value || h1, z = $('#t2').value || h2;
    return [`${d}T${a}:00+07:00`, `${d}T${z}:00+07:00`];
  };
  function paintVeh(){
    const [s,e] = win();
    $x('#vp').innerHTML = r.vehicles.map(v => {
      const busy = r.trips.some(x => x.resource_id === v.resource_id && overlap(s,e,x.start_at,x.end_at));
      const on = v.resource_id === vehId;
      return `<button class="row" data-v="${esc(v.resource_id)}" style="border:1.5px solid ${
        on?'var(--primary)':'var(--line)'};border-radius:12px;margin-bottom:8px;
        background:${on?'#EEF3FF':'#fff'}">
        ${v.thumb_id ? `<img class="rphoto" style="width:52px;height:40px" data-ph="${esc(v.thumb_id)}" alt="">`
                     : `<div class="rphoto" style="width:52px;height:40px">${IC.car}</div>`}
        <div class="body"><div class="t">${esc(v.name_th)}</div>
          <div class="s">${esc([v.capacity ? t('rmSeats')(v.capacity) : '',
            v.driver_name ? t('carDriver') + ' ' + firstName(v.driver_name) : t('carNoDriver')
            ].filter(Boolean).join(' · '))}</div>
          <div style="font-size:10.5px;font-weight:800;color:${busy?'var(--bad)':'var(--ok)'}">
            ${esc(busy ? t('carVehBusy') : t('carVehFree'))}</div></div>
        <span class="ck" style="color:var(--primary);font-weight:800;${on?'':'visibility:hidden'}">✓</span>
      </button>`;
    }).join('');
    paintPhotos($('#vp'));
    document.querySelectorAll('#vp .row').forEach(b => b.onclick = () => { vehId = b.dataset.v; paintVeh(); });
    const allBusy = r.vehicles.every(v => {
      const [s2,e2] = win();
      return r.trips.some(x => x.resource_id === v.resource_id && overlap(s2,e2,x.start_at,x.end_at));
    });
    $x('#noFree').innerHTML = allBusy ? `<div class="note" style="border-color:var(--bad);margin-top:8px">
      ${IC.info}<div><b>${esc(t('carNoFree'))}</b><br>${esc(t('carGrabHint'))}</div></div>
      <button class="btn ghost" id="grabBtn" style="margin-top:8px">${esc(t('carGrab'))}</button>` : '';
    if($('#grabBtn')) $('#grabBtn').onclick = async () => {
      const [s3,e3] = win();
      try{ await apiRetry('logNoCar', { wanted:`${s3} → ${e3}`, alt_action:'grab',
             project_code:$('#pj').value || '' }, 'POST');
           toast(t('carGrabOk'),'ok'); back(); }
      catch(e){ toast(t('netErr'),'bad'); }
    };
  }
  paintVeh();
  ['#dd','#t1','#t2'].forEach(sl => { const el = $(sl); if(el) el.onchange = paintVeh; });

  /* ── จุดแวะ: แต่ละจุดผูกโครงการเองได้ แล้วโชว์ให้เห็นเลยว่าหารกันยังไง */
  let stops = [];
  function paintStops(){
    $x('#st').innerHTML = stops.map((sp,i) => `
      <div style="border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:11.5px;font-weight:800;color:var(--ink-3)">${esc(t('carStopN')(i+1))}</span>
          <button data-x="${i}" style="font-size:11.5px;color:var(--bad);font-weight:700">${esc(t('cancel'))}</button>
        </div>
        <input data-p="${i}" value="${esc(sp.place || '')}" placeholder="${esc(t('carStopPh'))}"
          style="margin-bottom:6px">
        <select data-j="${i}">${projOpts(t('carProjectPh'))}</select>
      </div>`).join('');
    stops.forEach((sp,i) => { const s2 = document.querySelector(`#st [data-j="${i}"]`); if(s2) s2.value = sp.project_code || ''; });
    document.querySelectorAll('#st [data-x]').forEach(b =>
      b.onclick = () => { stops.splice(Number(b.dataset.x),1); paintStops(); });
    document.querySelectorAll('#st [data-p]').forEach(el =>
      el.oninput = () => { stops[Number(el.dataset.p)].place = el.value; });
    document.querySelectorAll('#st [data-j]').forEach(el =>
      el.onchange = () => { stops[Number(el.dataset.j)].project_code = el.value; paintSplit(); });
    paintSplit();
  }
  function paintSplit(){
    const codes = [...new Set([$('#pj').value, ...stops.map(s => s.project_code)].filter(Boolean))];
    $x('#split').textContent = codes.length > 1
      ? t('carSplitN')(codes.length, codes.join(' · '))
      : (codes.length ? t('carSplit') + ': ' + t('carSplitOne') : '');
  }
  $('#addStop').onclick = () => { stops.push({ place:'', project_code:$('#pj').value || '' }); paintStops(); };
  $('#pj').onchange = paintSplit;
  paintStops();

  /* ── ส่ง */
  $('#goBk').onclick = async () => {
    const purpose = $('#pp').value.trim();
    const project = $('#pj').value;
    const d = $('#dd').value, a = $('#t1').value, z = $('#t2').value;
    if(!purpose){ toast(t('admNeedTitle'),'bad'); return; }
    if(!project){ toast(t('carNeedProject'),'bad'); $('#pj').focus(); return; }
    if(!d || !a || !z || z <= a){ toast(t('rmBadTime'),'bad'); return; }
    const b = $('#goBk'); b.disabled = true;
    try{
      const res = await apiRetry('createCarBooking', {
        resource_id:vehId, purpose, project_code:project,
        passengers:$('#px').value.trim(),
        stops: JSON.stringify(stops.filter(s => s.place.trim())),
        start_at:`${d}T${a}:00+07:00`, end_at:`${d}T${z}:00+07:00`
      }, 'POST');
      if(res?.error === 'CLASH'){
        const c = res.clash || {};
        toast(`${c.sameCar ? t('carClash') : t('carClashDriver')} · ${
          c.who ? t('carClashBy')(c.who, `${hhmm(c.start_at)}–${hhmm(c.end_at)}`) : ''}`, 'bad');
        b.disabled = false; return;
      }
      if(res?.error === 'NO_PROJECT'){ toast(t('carNeedProject'),'bad'); b.disabled = false; return; }
      if(res?.ok === false) throw 0;
      toast(t('carOk'),'ok');
      S.stack = [{ name:'home', params:{} }]; go('cars', { date:d });
    }catch(e){ toast(t('netErr'),'bad'); b.disabled = false; }
  };
};

/** ย่อรูปเป็น 2 ขนาด: full (อ่านฉลาก) + thumb (แสดงในรายการ)
    วาดผ่าน canvas ทำให้ EXIF ทั้งหมดรวมถึงพิกัด GPS หายไปเอง */
function shrink2(file){
  return new Promise((res, rej) => {
    const img = new Image(), fr = new FileReader();
    fr.onload = () => img.src = fr.result;
    fr.onerror = rej;
    img.onload = () => {
      const draw = (max, q) => {
        let { width:w, height:h } = img;
        const sc = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * sc); h = Math.round(h * sc);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        return c.toDataURL('image/jpeg', q);
      };
      res({ full: draw(1280, .82), thumb: draw(400, .7) });
    };
    img.onerror = rej;
    fr.readAsDataURL(file);
  });
}

/** โหลดรูปทุกใบในหน้าเดียวด้วยคำขอเดียว — เดิมยิงทีละใบแล้วต่อคิวกันจนช้า */
const photoCache = {};
async function paintPhotos(scope){
  const els = [...(scope || document).querySelectorAll('img[data-ph]')];
  if(!els.length) return;
  els.forEach(e => { if(photoCache[e.dataset.ph]) e.src = photoCache[e.dataset.ph]; });
  const need = [...new Set(els.map(e => e.dataset.ph).filter(id => id && !photoCache[id]))];
  if(!need.length) return;
  try{
    const r = await apiRetry('getPhotos', { ids:need.slice(0,12).join(',') }, 'POST');
    Object.keys(r?.photos || {}).forEach(k => photoCache[k] = r.photos[k]);
    els.forEach(e => { if(photoCache[e.dataset.ph]) e.src = photoCache[e.dataset.ph]; });
  }catch(e){}
}

/** ดึงรูปจากเซิร์ฟเวอร์ (ไฟล์ใน Drive เป็นส่วนตัว ไม่ได้เปิดลิงก์สาธารณะ) */
async function loadPhoto(fileId, imgEl){
  if(!fileId || !imgEl) return null;
  if(photoCache[fileId]){ imgEl.src = photoCache[fileId]; return photoCache[fileId]; }
  try{
    const r = await apiRetry('getPhoto', { file_id:fileId }, 'GET');
    if(r?.data){ photoCache[fileId] = r.data; if(imgEl) imgEl.src = r.data; return r.data; }
  }catch(e){}
  return null;
}

/* ── ดูรูปเต็มจอ + ซูม ─────────────────────────────────────────
   จ่าหน้าซองมักตัวเล็กและเบลอ ถ้าอ่านไม่ออกคนจะไม่กล้ากดรับ
   จึงต้องซูมได้จริง ทั้งด้วยปุ่ม แตะสองครั้ง และนิ้วหุบ-กาง */
let lbZ = 1, lbX = 0, lbY = 0;
function lbApply(){
  $('#lbImg').style.transform = `translate(${lbX}px,${lbY}px) scale(${lbZ})`;
  $('#lbFit').textContent = Math.round(lbZ * 100) + '%';
}
function lbSet(z, keepPan){
  lbZ = Math.min(6, Math.max(1, z));
  if(lbZ === 1 || !keepPan){ lbX = 0; lbY = 0; }
  lbApply();
}
async function openPhoto(fileId, title){
  if(!fileId){ toast(t('noPhoto')); return; }
  const img = $('#lbImg');
  img.removeAttribute('src');
  $('#lbTitle').textContent = title || '';
  $('#lbHint').textContent = t('zoomHint');
  lbSet(1);
  $('#lb').classList.add('on');
  const data = await loadPhoto(fileId, img);
  if(!data){ toast(t('netErr'), 'bad'); $('#lb').classList.remove('on'); }
}
function closePhoto(){ $('#lb').classList.remove('on'); }
$('#lbX').onclick   = closePhoto;
$('#lbIn').onclick  = () => lbSet(lbZ * 1.6, true);
$('#lbOut').onclick = () => lbSet(lbZ / 1.6, true);
$('#lbFit').onclick = () => lbSet(lbZ > 1 ? 1 : 2.5);

(function lbGestures(){
  const stage = $('#lbStage');
  let pts = new Map(), startDist = 0, startZ = 1, panning = false, sx = 0, sy = 0, lastTap = 0;

  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(pts.size === 2){
      const [a, b] = [...pts.values()];
      startDist = Math.hypot(a.x - b.x, a.y - b.y); startZ = lbZ;
    }else if(pts.size === 1){
      panning = lbZ > 1; sx = e.clientX - lbX; sy = e.clientY - lbY;
      const now = Date.now();
      if(now - lastTap < 300) lbSet(lbZ > 1 ? 1 : 2.5);   // แตะสองครั้งเพื่อซูม
      lastTap = now;
    }
  });
  stage.addEventListener('pointermove', e => {
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(pts.size === 2 && startDist){
      const [a, b] = [...pts.values()];
      lbSet(startZ * (Math.hypot(a.x - b.x, a.y - b.y) / startDist), true);
    }else if(panning && pts.size === 1){
      lbX = e.clientX - sx; lbY = e.clientY - sy; lbApply();
    }
  });
  const up = e => { pts.delete(e.pointerId); if(pts.size < 2) startDist = 0; if(!pts.size) panning = false; };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
})();

/* ── ตัวเลือกผู้รับแบบค้นหา ─────────────────────────────────────
   40+ คน เลื่อนหาใน dropdown ไม่ไหว → พิมพ์ 2-3 ตัวอักษรแล้วกรอง
   ค้นได้ทั้งชื่อไทย ชื่ออังกฤษ และชื่อเล่น เพราะฉลากพัสดุมักเขียนชื่อเล่น */
/** รายชื่อพนักงานถูกโหลดแบบเรียกเมื่อใช้ ถ้าลืมเรียกก่อน ตัวเลือกจะว่างเปล่า */
async function ensureEmployees(){
  if(S.employees.length) return;
  try{ const r = await apiRetry('getEmployees', {}, 'GET'); S.employees = r?.items || []; }catch(e){}
}
function pickPerson(){
  return new Promise(resolve => {
    sheet(`<h3>${esc(t('inRecipient'))}</h3>
      <input id="pkSearch" placeholder="${esc(t('pkSearch'))}" autocomplete="off">
      <div id="pkList"></div>
      <button class="btn ghost" id="pkCancel" style="margin-top:10px">${esc(t('cancel'))}</button>`);

    const norm = s => String(s || '').toLowerCase().replace(/\s|\./g, '');
    const listEl = $('#pkList'), inp = $('#pkSearch');

    const paint = (kw) => {
      const k = norm(kw);
      const hits = !k ? S.employees
        : S.employees.filter(p => norm(p.name_th).includes(k) ||
                                  norm(p.name_en).includes(k) ||
                                  norm(p.nickname).includes(k));
      listEl.innerHTML =
        `<button class="pk-row unknown" data-u="1">
           <span class="av">?</span>
           <span class="b"><span class="t">${esc(t('inUnknown'))}</span>
           <span class="s">${esc(t('pkUnknownSub'))}</span></span>
         </button>` +
        (hits.length ? hits.map(p => `
          <button class="pk-row" data-id="${esc(p.kenan_user_id)}">
            <span class="av">${esc(String(p.nickname || p.name_th || '?').trim().charAt(0))}</span>
            <span class="b">
              <span class="t">${esc(p.name_th || p.name_en)}${p.nickname ? ' · ' + esc(p.nickname) : ''}</span>
              <span class="s">${esc(p.department || '')}</span>
            </span>
          </button>`).join('')
        : `<div class="pk-empty">${esc(t('pkNone'))}</div>`);

      listEl.querySelectorAll('.pk-row').forEach(b => b.onclick = () => {
        closeSheet();
        resolve(b.dataset.u ? { unknown:true }
                            : S.employees.find(p => p.kenan_user_id === b.dataset.id));
      });
    };

    paint('');
    inp.oninput = () => paint(inp.value);
    $('#pkCancel').onclick = () => { closeSheet(); resolve(null); };
    setTimeout(() => inp.focus(), 260);
  });
}

/* ── 9. BOOT — LIFF init ครั้งเดียวสำหรับทั้งแอป ───────────────── */
/* เดิมดัก error ทุกชนิดแล้วเปลี่ยนทั้งหน้าเป็น "Connection failed"
   ทำให้ error เล็กๆ ที่ไม่เกี่ยวกับเน็ตเลย กลืนหน้าที่โหลดสำเร็จไปแล้วทิ้ง
   ตอนนี้แค่บันทึกไว้ และเตือนเบาๆ เฉพาะตอนหน้ายังว่างจริงๆ */
S.lastError = null;
function softFail(e){
  S.lastError = e;
  try{ console.error('[KC]', e); }catch(_){}
  const main = $('#main');
  if(main && main.textContent.trim().length < 5) errorScreen(e);
}
window.addEventListener('error', ev => softFail(ev.error || ev));
window.addEventListener('unhandledrejection', ev => softFail(ev.reason));

async function boot(){
  try{ if(navigator.language?.startsWith('en')) S.lang = 'en'; }catch(e){}

  if(DEMO){
    S.uid = 'U-demo';
    S.profile = { displayName:'พิพัฒน์ ส.', pictureUrl:'' };
    const a = MOCK.getAuthState;
    S.me = a.user; S.isAdmin = a.isAdmin; S.isOfficer = a.isOfficer;
    S.regStatus = a.registrationStatus; S.notifCount = a.notificationCount;
    $('#bellDot').textContent = S.notifCount; $('#bellDot').hidden = false;
    const banner = el(`<div style="background:#FFFBEB;border-bottom:1px solid #FDE68A;color:#92400E;
      font-size:11.5px;font-weight:600;text-align:center;padding:6px 12px">
      โหมดพรีวิว · ข้อมูลตัวอย่าง · ใส่ CFG.GAS_URL เพื่อใช้งานจริง</div>`);
    document.querySelector('.topbar').after(banner);
    go('home');
    return;
  }

  const timeout = new Promise(r => setTimeout(() => r('timeout'), CFG.LIFF_TIMEOUT_MS));
  try{
    const r = await Promise.race([
      liff.init({ liffId:CFG.LIFF_ID }).then(() => 'ok').catch(() => 'fail'),
      timeout
    ]);
    if(r === 'ok'){
      S.liffReady = true;
      if(!liff.isLoggedIn()){ liff.login(); return; }
      S.profile = await liff.getProfile();
      S.uid = S.profile.userId;
      // ล้าง ?code=&state=&liff... ที่ LIFF ต่อท้ายมาหลังล็อกอิน
      // ไม่ล้างแล้วกดรีเฟรชหรือย้อนกลับจะวนกลับเข้า flow ล็อกอินซ้ำ
      if(location.search) history.replaceState({}, '', location.pathname);
    }
  }catch(e){}

  if(!S.uid){ go('gate'); return; }

  let auth;
  try{
    auth = await apiRetry('bootstrap', {}, 'GET');
    if(auth?.announcements) S.bootNews = auth.announcements;
  }catch(e){
    if(e.message === 'NO_CONFIG'){ render('home'); return; }
    S.stack = []; render('offline', {}); return;   // ต่อเซิร์ฟเวอร์ไม่ได้ → อย่าพาไปกรอกฟอร์ม
  }

  S.me        = auth?.user || null;
  S.isAdmin   = !!auth?.isAdmin;
  S.isSuper   = !!auth?.isSuper;
  S.isOfficer = !!(auth?.isAdmin || auth?.isOfficer);
  S.regStatus = auth?.registrationStatus || (S.me ? 'approved' : 'none');
  S.notifCount= auth?.notificationCount || 0;
  if(S.notifCount){ $('#bellDot').textContent = S.notifCount; $('#bellDot').hidden = false; }

  S.stack = [];
  if(!S.me?.consent_at)               go('consent');
  else if(S.regStatus !== 'approved') go('register');
  else if(START_AT && START_AT !== 'home'){
    // มาจากปุ่ม Rich Menu หรือลิงก์ในข้อความแจ้งเตือน → เปิดหน้านั้นเลย แต่ยังย้อนกลับได้
    S.stack = [{ name:'home', params:{} }];
    go(START_AT, START_REC ? { rec:START_REC } : {});
  }
  else                                go('home');
}
boot();
</script>
