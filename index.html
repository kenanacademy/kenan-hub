<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0033CC">
<title>Kenan Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   DESIGN TOKENS — ตรงกับ Kenan Connect Vision ใน Stitch
   ───────────────────────────────────────────────────────────── */
:root{
  --primary:#0033CC;
  --primary-dark:#0011AD;
  --secondary:#0044FF;
  --neutral:#EBECEF;

  --ink:#0F172A;
  --ink-2:#475569;
  --ink-3:#94A3B8;
  --bg:#F6F7F9;
  --surface:#FFFFFF;
  --line:#E2E6EC;

  --ok:#059669;
  --ok-bg:#ECFDF5;
  --warn:#D97706;
  --warn-bg:#FFFBEB;
  --danger:#DC2626;
  --danger-bg:#FEF2F2;
  /* ชื่อย่อที่โค้ดเรียกใช้อยู่หลายที่ ถ้าไม่ประกาศไว้ สีแดงจะหายไปเงียบๆ
     (หน้าฉุกเฉิน เส้นเวลาปัจจุบัน ปุ่มยกเลิก เรื่องด่วน) */
  /* น้ำเงินเข้มของเมนูข้าง — ให้แอปมีสันหลัง ไม่ใช่การ์ดขาวลอยบนเทาทั้งหน้า */
  --navy:#0B1B45;
  --bad:#DC2626;
  --bad-bg:#FEF2F2;
  --bad-line:#FECACA;

  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --shadow-lg:0 8px 32px rgba(15,23,42,.14);

  --topbar-h:56px;
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);

  --font:'Plus Jakarta Sans','Noto Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.5;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
[hidden]{display:none!important}

/* ── App shell ─────────────────────────────────────────────── */
#app{min-height:100dvh;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:40;
  height:var(--topbar-h);flex:0 0 auto;
  display:flex;align-items:center;gap:4px;
  padding:0 6px;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.topbar .icon-btn{
  width:40px;height:40px;border-radius:var(--r-sm);
  display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto;
}
.topbar .icon-btn:active{background:var(--neutral)}
.topbar h1{
  flex:1;min-width:0;margin:0;padding:0 4px;
  font-size:16px;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding-left:8px}
.brand .mark{
  width:28px;height:28px;border-radius:8px;flex:0 0 auto;
  background:var(--primary);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:15px;
}
.brand .txt{font-size:16px;font-weight:700;letter-spacing:-.01em}
.bell{position:relative}
.bell .dot{
  position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--danger);color:#fff;
  font-size:10px;font-weight:700;line-height:17px;text-align:center;
  border:2px solid var(--surface);
}

main{flex:1 1 auto;padding:16px 16px calc(var(--nav-h) + var(--safe-b) + 24px)}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── Bottom nav ────────────────────────────────────────────── */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);
}
.nav button{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink-3);font-size:10.5px;font-weight:600;
}
.nav button.on{color:var(--primary)}
.nav svg{width:23px;height:23px}
.nav button{position:relative}
.nav .ndot{position:absolute;top:6px;left:50%;margin-left:5px;min-width:16px;height:16px;
  padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;
  font-size:9.5px;font-weight:800;line-height:16px;text-align:center}

/* ── FAB: ปุ่มบันทึกพัสดุเข้า — เข้าถึงได้ 1 แตะจากทุกหน้า ──── */
.fab{
  position:fixed;right:16px;z-index:45;
  bottom:calc(var(--nav-h) + var(--safe-b) + 16px);
  height:52px;padding:0 20px 0 16px;border-radius:26px;
  display:flex;align-items:center;gap:8px;
  background:var(--primary);color:#fff;
  font-weight:700;font-size:14px;
  box-shadow:0 6px 20px rgba(0,51,204,.36);
}
.fab:active{transform:scale(.97)}
.fab svg{width:22px;height:22px}

/* ── Cards & layout ────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card + .card{margin-top:12px}
.section-title{font-size:13px;font-weight:700;color:var(--ink-2);margin:22px 0 10px;letter-spacing:.01em}
.section-title:first-child{margin-top:0}
.section-title .en{font-weight:500;color:var(--ink-3);font-size:11px;margin-left:6px}

.greet{margin:0 0 18px}
.greet h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}
.greet p{margin:3px 0 0;color:var(--ink-3);font-size:13px}

/* ── หน้าแรก: ทักทาย · สิ่งที่ค้าง · ตารางวันนี้ ─────────────── */
.hgreet{margin-bottom:20px}
.hdate{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--primary);margin-bottom:6px}
.hgreet h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.hgreet p{margin:5px 0 0;font-size:13.5px;color:var(--ink-3)}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin-bottom:22px}
.todoc{display:flex;align-items:baseline;gap:9px;padding:14px 15px;border-radius:var(--r);
  background:#EEF3FF;border:1px solid #D6E1FF;text-align:left}
.todoc .n{font-size:25px;font-weight:800;line-height:1;color:var(--primary)}
.todoc .l{font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.3}
.todoc.warn{background:var(--warn-bg);border-color:#FDE49A}
.todoc.warn .n{color:var(--warn)}
.todoc.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.todoc.bad .n{color:var(--bad)}
.quiet{font-size:13px;color:var(--ink-3);padding:16px 2px}
.hsplit{display:block}
@media(min-width:900px){
  .hsplit{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:34px;align-items:start}
  .hsplit .section-title:first-child{margin-top:0}
  .hgreet h2{font-size:30px}
}

/* ── Module tiles ──────────────────────────────────────────── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{
  position:relative;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:15px 14px;min-height:104px;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .12s,box-shadow .12s;
}
.tile:active{transform:scale(.975);box-shadow:var(--shadow)}
.tile .ic{
  width:38px;height:38px;border-radius:11px;
  background:#EEF3FF;color:var(--primary);
  display:grid;place-items:center;
}
.tile .ic svg{width:21px;height:21px}
.tile .nm{font-size:14px;font-weight:700;line-height:1.3}
.tile .en{font-size:11px;color:var(--ink-3);font-weight:500;margin-top:1px}
.tile .badge.soonb{background:var(--neutral);color:var(--ink-3)}
.tile .badge{
  position:absolute;top:11px;right:11px;
  padding:3px 8px;border-radius:99px;
  font-size:10.5px;font-weight:700;
  background:var(--primary);color:#fff;
}
.tile .badge.warn{background:var(--warn)}
.tile.soon{opacity:.5}
.tile.soon .badge{background:var(--neutral);color:var(--ink-3)}
.tile.sos .ic{background:#FEF2F2;color:var(--danger)}

/* ── List rows ─────────────────────────────────────────────── */
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line)}
.row:active{background:var(--bg)}
.row .thumb{
  width:48px;height:48px;border-radius:10px;flex:0 0 auto;
  background:var(--neutral);object-fit:cover;
  display:grid;place-items:center;color:var(--ink-3)
}
.row .body{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .go{color:var(--ink-3);flex:0 0 auto}
.row .go svg{width:18px;height:18px;display:block}

.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.pill.wait{background:var(--warn-bg);color:var(--warn)}
.pill.done{background:var(--ok-bg);color:var(--ok)}
.pill.new{background:#EEF3FF;color:var(--primary)}

/* ── Forms ─────────────────────────────────────────────────── */
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field label .en{font-weight:400;color:var(--ink-3);font-size:11px;margin-left:5px}
.field label .req{color:var(--danger);margin-left:3px}
.field input,.field select,.field textarea{
  width:100%;padding:13px 14px;
  border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--surface);font-size:16px; /* 16px กัน iOS zoom */
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,51,204,.1)
}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.field .err{font-size:12px;color:var(--danger);margin-top:5px;font-weight:600}

.btn{
  width:100%;padding:15px;border-radius:var(--r);
  font-size:15.5px;font-weight:700;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:active:not(:disabled){background:var(--primary-dark)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:#EEF3FF;color:var(--primary)}
.btn.danger{background:var(--danger);color:#fff}
.btn + .btn{margin-top:9px}
.btn svg{width:20px;height:20px}

/* ปุ่มหลักติดขอบล่าง — อยู่ในระยะนิ้วโป้งเสมอ */
.sticky-cta{
  position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
  margin-top:20px;z-index:20;
}

/* ── Camera capture ────────────────────────────────────────── */
.shot{
  position:relative;width:100%;aspect-ratio:4/3;
  border-radius:var(--r-lg);overflow:hidden;
  background:var(--ink);display:grid;place-items:center;
}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .ph{color:#fff;text-align:center;opacity:.85;padding:20px}
.shot .ph svg{width:44px;height:44px;margin-bottom:8px}
.shot .ph p{margin:0;font-size:13px;font-weight:600}
.shot .retake{
  position:absolute;right:10px;bottom:10px;
  padding:8px 14px;border-radius:99px;
  background:rgba(15,23,42,.72);color:#fff;
  font-size:12.5px;font-weight:700;backdrop-filter:blur(8px);
}

/* ── Skeleton — ไม่เคยแสดงหน้าขาว ───────────────────────────── */
.sk{background:linear-gradient(90deg,#E9ECF1 25%,#F2F4F7 50%,#E9ECF1 75%);
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:var(--r-sm)}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-row{height:74px;margin-bottom:10px;border-radius:var(--r-lg)}

/* ── Empty state ───────────────────────────────────────────── */
.empty{text-align:center;padding:44px 24px;color:var(--ink-3)}
.empty svg{width:46px;height:46px;margin-bottom:12px;opacity:.5}
.empty h3{margin:0 0 5px;font-size:15px;font-weight:700;color:var(--ink-2)}
.empty p{margin:0;font-size:13px;line-height:1.6}

/* ── Toast ─────────────────────────────────────────────────── */
#toast{
  position:fixed;left:16px;right:16px;z-index:80;
  bottom:calc(var(--nav-h) + var(--safe-b) + 78px);
  padding:14px 16px;border-radius:var(--r);
  background:var(--ink);color:#fff;font-size:14px;font-weight:600;
  box-shadow:var(--shadow-lg);
  transform:translateY(20px);opacity:0;pointer-events:none;
  transition:.22s;
}
#toast.on{transform:none;opacity:1}
#toast.ok{background:var(--ok)}
#toast.bad{background:var(--danger)}

/* ── Bottom sheet — ยืนยันเร็วๆ โดยไม่ต้องเปลี่ยนหน้า ────────── */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.42);opacity:0;transition:.22s;pointer-events:none}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:8px 16px calc(20px + var(--safe-b));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:86dvh;overflow:auto;
}
#sheet.on{transform:none}
#sheet .grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
#sheet h3{margin:0 0 4px;font-size:17px;font-weight:700}
#sheet .sub{margin:0 0 16px;font-size:13px;color:var(--ink-3)}

/* ── ดูรูปเต็มจอ + ซูม (ต้องอ่านจ่าหน้าซองให้ออก) ─────────────── */
#lb{position:fixed;inset:0;z-index:90;background:#0B0F17;display:none;flex-direction:column}
#lb.on{display:flex}
#lb .top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;color:#fff;flex:0 0 auto}
#lb .top b{font-size:14px;font-weight:700}
#lb .x{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);
  display:grid;place-items:center;color:#fff;font-size:20px;line-height:1}
#lbStage{flex:1;overflow:hidden;position:relative;touch-action:none;display:grid;place-items:center}
#lbImg{max-width:100%;max-height:100%;transform-origin:center center;
  transition:transform .16s ease-out;will-change:transform;user-select:none;-webkit-user-drag:none}
#lb .zoom{display:flex;gap:10px;justify-content:center;align-items:center;
  padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 16px);flex:0 0 auto}
#lb .zb{min-width:56px;height:46px;padding:0 16px;border-radius:23px;background:rgba(255,255,255,.16);
  color:#fff;font-size:19px;font-weight:800;display:grid;place-items:center}
#lb .zb.wide{font-size:13.5px;font-weight:700}
#lb .hint{color:rgba(255,255,255,.55);font-size:11.5px;text-align:center;padding-bottom:4px}

/* รูปใหญ่ใน sheet ยืนยันรับของ */
.sheet-photo{width:100%;border-radius:12px;background:var(--neutral);display:block;
  aspect-ratio:4/3;object-fit:cover;margin-bottom:6px}
.sheet-photo-hint{font-size:11.5px;color:var(--primary);font-weight:700;text-align:center;margin:0 0 14px}

/* ── ตัวเลือกผู้รับแบบค้นหา (40+ คน เลื่อนหาไม่ไหว) ────────────── */
.picker-btn{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--surface);text-align:left;display:flex;align-items:center;gap:10px}
.picker-btn .nm{flex:1;min-width:0;font-size:15px}
.picker-btn .nm.ph{color:var(--ink-3)}
.picker-btn .nm small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500}
.picker-btn .ch{color:var(--ink-3);font-size:12px}
#pkSearch{width:100%;padding:13px 14px;border:1.5px solid var(--primary);border-radius:var(--r);
  font-size:16px;margin-bottom:10px;background:var(--surface)}
#pkList{max-height:46dvh;overflow:auto;margin:0 -4px}
.pk-row{width:100%;display:flex;align-items:center;gap:11px;padding:11px 10px;
  border-radius:10px;text-align:left}
.pk-row:active{background:var(--bg)}
.pk-row .av{width:34px;height:34px;border-radius:50%;background:#EEF3FF;color:var(--primary);
  font-size:13px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.pk-row .b{flex:1;min-width:0}
.pk-row .t{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-row .s{font-size:11.5px;color:var(--ink-3)}
.pk-row.unknown .av{background:var(--warn-bg);color:var(--warn)}
.row img.av{object-fit:cover}
.pk-row.place{align-items:flex-start}
.pk-row.place .t{white-space:normal;overflow:visible;font-size:13.5px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pk-row.place .pill{margin-top:2px}
.pk-empty{text-align:center;padding:26px 10px;color:var(--ink-3);font-size:13px}


/* ── ตารางห้องประชุม 08:00–18:00 ─────────────────────────────── */
.gridwrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gridscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ghead{display:flex;position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.ghead .hcell{flex:0 0 84px;padding:8px 5px;text-align:center;border-left:1px solid var(--line)}
.ghead .hcell .n{font-size:11.5px;font-weight:800;line-height:1.25}
.ghead .hcell .c{font-size:9.5px;color:var(--ink-3);font-weight:600}
.ghead .corner{flex:0 0 34px}
.gbody{display:flex;position:relative}
.ghours{flex:0 0 34px}
.ghours span{display:block;height:44px;font-size:9.5px;color:var(--ink-3);font-weight:700;
  text-align:right;padding-right:4px;transform:translateY(-5px)}
.gcol{flex:0 0 84px;position:relative;border-left:1px solid var(--line)}
.gcol .hr{height:44px;border-bottom:1px dashed var(--line)}
.gcol .hr:active{background:var(--bk-bg,#EEF3FF)}
.gev{position:absolute;left:2px;right:2px;border-radius:7px;padding:4px 5px;
  background:var(--primary);color:#fff;overflow:hidden;text-align:left}
.gev.mine{background:var(--ok)}
.gev.unb{background:var(--bad)}
/* แถบเลือกวัน/คัน — เดิมเรียกคลาสนี้อยู่แต่ไม่เคยประกาศ เลยออกมาเป็นข้อความเปล่าๆ */
.chips{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:1px 0 3px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);font-size:12px;font-weight:700;color:var(--ink-2);
  white-space:nowrap;line-height:1.25;text-align:center}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.chip .d{display:block;font-size:14.5px;font-weight:800;line-height:1.15}
.mini{padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  font-size:11.5px;font-weight:700;color:var(--ink-2)}
.mini.call{border-color:var(--primary);color:var(--primary)}
.times{display:flex;align-items:center;gap:8px;margin-top:4px}
.tbox{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:9px 6px;
  background:#fff;text-align:center}
.tbox.hl{border-color:var(--primary);background:#F5F8FF}
.tbox .k{font-size:10.5px;font-weight:700;color:var(--ink-3);margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{flex:0 0 auto;color:var(--ink-3);font-size:15px;font-weight:800}
/* การ์ดรถในหน้าจอง — อุตส่าห์ใส่รูปแล้ว ต้องเห็นว่ารถหน้าตายังไงจริงๆ
   และรูปคนขับต้องอยู่คู่กัน คนจองจะรู้ว่าไปเจอใครที่จุดนัด */
/* วันเกิดขึ้นบนหน้าแรกให้ทุกคนเห็น แทนการยิง LINE หา 40 คน
   (40 คน × 3 วันเกิด/เดือน = 120 ข้อความ = 40% ของโควตาฟรีทั้งเดือน) */
.bday{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);
  background:linear-gradient(100deg,#FFF7ED,#FEF2F2);border:1px solid #FED7AA;
  font-size:13px;color:var(--ink-2);line-height:1.5;margin-bottom:18px}
.bday .cake{font-size:24px;flex:0 0 auto}
.ntag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;
  background:var(--neutral);color:var(--ink-2);letter-spacing:.01em}
.ntag.hot{background:var(--bad-bg);color:var(--bad)}
.imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
.imgcell{position:relative;aspect-ratio:4/3;border-radius:9px;overflow:hidden;background:var(--neutral)}
.imgcell img{width:100%;height:100%;object-fit:cover}
.imgcell button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:20px}
.paxrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2px}
.paxchip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 11px;
  border-radius:99px;background:#EEF3FF;border:1px solid #D6E1FF;
  font-size:12px;font-weight:600;color:var(--primary)}
.paxchip button{font-size:13px;line-height:1;color:var(--primary);opacity:.6}
/* รูปอยู่ซ้ายเต็มความสูงการ์ด ข้อมูลอยู่ขวา
   แบบเดิมรูปอยู่บนแล้ว crop กลางภาพ เห็นแค่กันชนกับกระจก ไม่รู้ว่ารถคันไหน
   วางแนวนอนแล้วสัดส่วนใกล้เคียงรูปรถจริง (กว้างกว่าสูง) จึงเห็นทั้งคัน */
.vcard{display:flex;width:100%;text-align:left;align-items:stretch;
  border:1.5px solid var(--line);border-radius:14px;overflow:hidden;
  background:var(--surface);margin-bottom:11px}
.vcard.on{border-color:var(--primary);box-shadow:0 0 0 3px #EEF3FF}
.vpic{flex:0 0 42%;max-width:210px;min-height:132px;background:var(--neutral);position:relative}
.vphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  display:grid;place-items:center;color:var(--ink-3)}
.vphoto svg{width:36px;height:36px}
.vbody{flex:1;min-width:0;padding:12px 13px;display:flex;flex-direction:column}
.vhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.vname{font-size:15.5px;font-weight:800;line-height:1.25}
.vplate{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.02em;
  border:1.5px solid var(--ink-2);border-radius:5px;padding:1px 7px;margin-top:5px}
.vspec{font-size:11.5px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.vdrv{display:flex;align-items:center;gap:9px;margin-top:auto;padding-top:10px;
  border-top:1px solid var(--line)}
.dav{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 auto;
  background:#EEF3FF;color:var(--primary);display:grid;place-items:center;
  font-size:15px;font-weight:800}
.dnm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dco{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtel{font-size:11.5px;font-weight:800;color:var(--primary);white-space:nowrap;flex:0 0 auto;
  border:1px solid #D6E1FF;background:#EEF3FF;border-radius:8px;padding:6px 9px}
.vfree{font-size:11px;font-weight:800;margin-top:9px}
@media(max-width:520px){
  .vpic{flex:0 0 38%;min-height:118px}
  .dtel{padding:5px 7px;font-size:11px}
}

.tin{border:none;background:transparent;width:100%;text-align:center;font-weight:700;
  color:var(--ink);font-size:13px}
.tin.big{font-size:17px;font-weight:800;margin-top:2px}
.ptrow{display:flex;gap:10px}
.ptline{flex:0 0 26px;display:flex;flex-direction:column;align-items:center;padding-top:20px}
.ptdot{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ptdot.home{background:var(--ink-2)}
.ptbar{flex:1;width:2px;background:var(--line);margin:3px 0}
.ptbody{flex:1;min-width:0;padding-bottom:2px}
.pthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ptTag{font-size:11px;font-weight:800;color:var(--ink-3)}
.ptdel{font-size:11.5px;color:var(--bad);font-weight:700}
.ptseg{font-size:11.5px;font-weight:800;color:var(--primary);padding:7px 2px 9px;text-align:center}
.placebtn{text-align:left;justify-content:flex-start;line-height:1.4;white-space:normal;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.carleg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:9px;
  font-size:11px;color:var(--ink-2);font-weight:600}
.carleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.gev.live{background:var(--warn)}
.gev .p{font-size:8.5px;opacity:.85;line-height:1.2}
.gev .t{font-size:9.5px;font-weight:800;line-height:1.2}
.gev .w{font-size:9px;opacity:.9;line-height:1.25;margin-top:1px}
.gnow{position:absolute;left:34px;right:0;height:2px;background:var(--bad);z-index:3}
.gnow::before{content:'';position:absolute;left:-3px;top:-3px;width:8px;height:8px;
  border-radius:50%;background:var(--bad)}
.seg2{display:flex;background:var(--neutral);border-radius:10px;padding:3px;margin-bottom:12px}
.seg2 button{flex:1;padding:8px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.seg2 button.on{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rcard{display:flex;gap:11px;align-items:center;padding:11px;border:1px solid var(--line);
  border-radius:13px;background:var(--surface);margin-bottom:9px;width:100%;text-align:left}
.rphoto{width:74px;height:56px;border-radius:10px;object-fit:cover;background:var(--neutral);
  flex:0 0 auto;display:grid;place-items:center;color:var(--ink-3)}
.rphoto svg{width:26px;height:26px}

/* ── Consent / PDPA ────────────────────────────────────────── */
.legal{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;max-height:38dvh;overflow:auto;
  font-size:13px;line-height:1.75;color:var(--ink-2);
}
.legal h4{margin:14px 0 5px;font-size:13.5px;color:var(--ink);font-weight:700}
.legal h4:first-child{margin-top:0}
.legal ul{margin:5px 0;padding-left:18px}
.check{display:flex;gap:11px;align-items:flex-start;margin:15px 0;cursor:pointer}
.check input{width:21px;height:21px;flex:0 0 auto;margin-top:1px;accent-color:var(--primary)}
.check span{font-size:13.5px;line-height:1.55}

/* ── Lang toggle ───────────────────────────────────────────── */
.langsw{display:inline-flex;background:var(--neutral);border-radius:9px;padding:2px}
.langsw button{padding:6px 15px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.langsw button.on{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.09)}

.note{
  display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);
  background:var(--warn-bg);border:1px solid #FDE68A;
  font-size:12.5px;line-height:1.6;color:#92400E;
}
.note.info{background:#EEF3FF;border-color:#C7D7FE;color:#1E40AF}
.note svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px}

.contact-group{margin-bottom:18px}
.contact-group > h3{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.callbtn{
  width:42px;height:42px;border-radius:50%;flex:0 0 auto;
  background:var(--ok);color:#fff;display:grid;place-items:center;
}
.callbtn.sos{background:var(--danger)}
.callbtn svg{width:20px;height:20px}

/* ── แท็บเล็ต: กว้างขึ้นแต่ยังเป็นคอลัมน์เดียว ───────────────── */
@media(min-width:600px) and (max-width:899px){
  main{max-width:620px;margin:0 auto;width:100%}
  .tiles{grid-template-columns:repeat(3,1fr)}
}

/* ══════════════════════════════════════════════════════════════
   เดสก์ท็อป (≥900px) — เปลี่ยนโครงหน้าจริง ไม่ใช่แค่ขยายคอลัมน์มือถือ
   ของเดิมบีบทุกอย่างไว้ 560px บนจอ 1440px = ทิ้งพื้นที่ไป 880px
   และแถบเมนูล่างแบบมือถือบนจอคอมเป็นรูปแบบที่ผิดตั้งแต่ต้น
   ══════════════════════════════════════════════════════════════ */
#side{display:none}

@media(min-width:900px){
  #app{
    display:grid;
    grid-template-columns:252px minmax(0,1fr);
    grid-template-rows:auto minmax(0,1fr);
    min-height:100dvh;
  }
  #side{
    grid-row:1/3;grid-column:1;
    display:flex;flex-direction:column;
    background:var(--navy);color:#fff;
    position:sticky;top:0;height:100dvh;overflow-y:auto;
  }
  .topbar{grid-column:2;grid-row:1;height:66px;padding:0 26px}
  .topbar h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .topbar .icon-btn{width:34px;height:34px;margin-left:-6px}
  .brand{display:none!important}
  main{grid-column:2;grid-row:2;max-width:1180px;padding:26px 30px 60px}
  .nav{display:none}
  .tiles{grid-template-columns:repeat(4,1fr);gap:14px}
  .tile{min-height:118px;padding:17px 16px}

  /* ตารางจอง: ให้คอลัมน์ยืดเต็มความกว้าง ไม่ใช่ 84px แล้วเหลือที่ว่างครึ่งจอ */
  .gridscroll > div{width:100%}
  .gcol,.ghead .hcell{flex:1 1 0;min-width:104px}
  .ghours,.ghead .corner{flex:0 0 42px}
  .gnow{left:42px}

  /* ปุ่มหลักยังลอยติดตาม แต่ไม่กินความกว้างทั้งจอและไม่บังตาราง */
  .sticky-cta{padding:10px 0;background:none;border:0;display:flex;justify-content:flex-end;
    bottom:14px;pointer-events:none}
  .sticky-cta .btn{width:auto;min-width:210px;pointer-events:auto;box-shadow:var(--shadow)}

  /* บล็อกการจองบนจอกว้าง: อ่านเหมือนปฏิทินจริง ไม่ใช่แผ่นสีทึบเต็มช่อง */
  .gev{color:var(--ink);background:#EEF3FF;border-left:3px solid var(--primary);
    padding:6px 9px;border-radius:6px}
  .gev .t{font-size:11.5px}
  .gev .w{font-size:11px;opacity:.72}
  .gev .p{font-size:10px;opacity:.7}
  .gev.mine{background:var(--ok-bg);border-left-color:var(--ok)}
  .gev.live{background:var(--warn-bg);border-left-color:var(--warn)}
  .gev.unb{background:var(--bad-bg);border-left-color:var(--bad)}
  .fab{bottom:26px;right:26px}

  /* ฟอร์มและรายการไม่ควรยืดเต็ม 1180px — บรรทัดยาวเกินไปอ่านไม่ไหว
     ของที่ควรกว้างจริงๆ (ตาราง · ไทล์ · แดชบอร์ด) ยกเว้นไว้ด้านล่าง */
  main > .view > .card,
  main > .view > .rows,
  main > .view > .note,
  main > .view > .empty,
  main > .view > input,
  main > .view > select,
  main > .view > textarea,
  main > .view > .btn{max-width:780px}
  main > .view > #dq{max-width:520px}
  main > .view > .gridwrap,
  main > .view > .tiles,
  main > .view > .hsplit,
  main > .view > .todo,
  main > .view > .cols2,
  main > .view > .bkwrap{max-width:none}

  /* หน้าจอง: ตารางซ้าย · รายการห้อง/รถ/Zoom ขวา
     เดิมรายการอยู่ล่างสุดเพราะเขียนเรียงตามมือถือ บนจอกว้างจึงเหลือที่ว่างข้างตารางเปล่าๆ
     ต้องเลื่อนลงไปดูรถทั้งที่มีที่ว่างอยู่ข้างๆ */
  .bkwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start;max-width:none}
  .bkwrap .section-title:first-child{margin-top:0}
  .bkside{position:sticky;top:82px}

  /* รายชื่อ 40 คนบนจอกว้าง อ่านสองคอลัมน์เร็วกว่าไล่ลงทีละแถว */
  /* ใช้ column ไม่ใช่ grid — grid จะโยนหัวข้อแผนกไปคอลัมน์ซ้ายและคนไปคอลัมน์ขวา
     column ยังไหลตามลำดับการอ่านเดิม */
  .dircols{columns:2;column-gap:26px;max-width:none}
  .eqcols{columns:2;column-gap:22px;max-width:none}
  .eqcols .rcard{break-inside:avoid;display:flex;width:100%}
  .eqcols .section-title{break-inside:avoid}
  .dircols .dgrp{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%}
  .dircols .dgrp .section-title:first-child{margin-top:0}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .cols2 .rows{margin:0}
  /* แผ่นล่างบนจอคอมไม่ควรกว้างเต็ม 1440px — อ่านยากและดูเหมือนหลุดขอบ */
  #sheet{max-width:540px;left:50%;right:auto;transform:translateX(-50%) translateY(100%);
         padding:8px 22px 24px}
  #sheet.on{transform:translateX(-50%) translateY(0)}
}

@media(min-width:1280px){
  main{padding:30px 44px 64px}
  .tiles{grid-template-columns:repeat(4,1fr)}
}

/* ── เมนูข้าง ─────────────────────────────────────────────────── */
/* สลับภาษาต้องอยู่ตรงที่เห็นทันที ไม่ใช่ซ่อนในหน้าโปรไฟล์
   ออฟฟิศมีทั้งเจ้าหน้าที่ต่างชาติ และคนไทยที่ไม่สะดวกภาษาอังกฤษ */
.langtop{display:flex;gap:2px;background:var(--neutral);border-radius:9px;padding:3px;flex:0 0 auto}
.langtop button{padding:5px 10px;border-radius:7px;font-size:11.5px;font-weight:800;color:var(--ink-3)}
.langtop button.on{background:#fff;color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media(min-width:900px){ .langtop{margin-left:auto} }

.sbrand{display:flex;align-items:center;gap:10px;padding:20px 18px 18px}
.sbrand .mark{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--navy);
  display:grid;place-items:center;font-weight:800;font-size:17px;flex:0 0 auto}
.sbrand .txt{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.sbrand .sub{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.04em;
  text-transform:uppercase}
.sgrp{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:rgba(255,255,255,.38);padding:16px 18px 7px}
#side nav{display:flex;flex-direction:column;padding:0 8px;gap:1px}
.slink{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;
  color:rgba(255,255,255,.76);font-size:13.5px;font-weight:600;text-align:left;width:100%}
.slink svg{width:19px;height:19px;flex:0 0 auto;opacity:.85}
.slink:hover{background:rgba(255,255,255,.07);color:#fff}
.slink.on{background:var(--primary);color:#fff}
.slink.on svg{opacity:1}
.slink .sb{margin-left:auto;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:var(--bad);color:#fff;font-size:10px;font-weight:800;line-height:19px;text-align:center}
.sfoot{margin-top:auto;padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.1)}
.sme{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.sme .av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto}
.sme .n{font-size:13px;font-weight:700;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sme .d{font-size:10.5px;color:rgba(255,255,255,.5);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ══════════ เพิ่ม 2026-09-05: พอร์ทัลคนขับ · ป้าย QR · ฟอร์มเพิ่มรายการ ══════════ */

/* ── ฟอร์มที่มีหลายช่อง ────────────────────────────────────────
   ปัญหาเดิม: ฟอร์มเพิ่มรายการเป็นแถบผอมยาว ต้องเลื่อนสิบกว่าครั้งกว่าจะถึงปุ่มบันทึก
   ทั้งที่บนจอคอมมีที่ว่างข้างๆ เหลือเฟือ และช่องส่วนใหญ่สั้นมาก */
#sheet.wide{max-width:760px}
@media(min-width:900px){ #sheet.wide{width:760px} }
/* กรอบถ่ายรูปในฟอร์มกว้าง ไม่ต้องกว้างเต็มแผ่น — เป้าถ่ายรูปไม่ได้ดีขึ้นตามขนาด */
#sheet.wide .shot{max-width:380px}
.fsec{margin:18px 0 4px;padding-top:14px;border-top:1px solid var(--line)}
.fsec:first-of-type{border-top:0;padding-top:0;margin-top:6px}
.fsec h4{margin:0 0 3px;font-size:12.5px;font-weight:800;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-3)}
.fsec .why{margin:0 0 12px;font-size:12px;line-height:1.55;color:var(--ink-2)}
.fhint{font-size:11px;line-height:1.5;color:var(--ink-3);margin:-8px 0 12px}
@media(min-width:760px){
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .fgrid .full{grid-column:1/-1}
}

/* ── ป้าย QR สำหรับพิมพ์ ──────────────────────────────────────
   ตั้งใจให้พอดีสติกเกอร์ A4 แบบ 3×8 (70×37 มม.) ที่หาซื้อได้ทั่วไป
   ทุกอย่างเป็นมิลลิเมตรจริง เพราะป้ายที่พิมพ์ออกมาผิดขนาดคือป้ายที่แปะไม่ได้ */
.lbgrid{display:grid;grid-template-columns:repeat(3,70mm);gap:0;justify-content:center}
.lbl{width:70mm;height:37mm;box-sizing:border-box;padding:4mm 4mm 3mm;
  display:flex;gap:3.5mm;align-items:center;border:1px dashed var(--line);overflow:hidden}
.lbl .qr{flex:0 0 auto;width:26mm;height:26mm}
.lbl .qr svg{width:100%;height:100%;display:block}
.lbl .tx{min-width:0;flex:1}
.lbl .nm{font-size:11pt;font-weight:800;line-height:1.15;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lbl .tg{font-size:12pt;font-weight:800;letter-spacing:.06em;margin-top:1.5mm;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.lbl .lo{font-size:8pt;color:#444;margin-top:1mm;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lbpick{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:var(--r);background:var(--surface);width:100%;text-align:left;margin-bottom:7px}
.lbpick.on{border-color:var(--primary);background:var(--primary-bg,#EEF2FF)}
.lbpick .bx{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);flex:0 0 auto;
  display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff}
.lbpick.on .bx{background:var(--primary);border-color:var(--primary)}
@media print{
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{position:absolute;inset:0;padding:0;background:#fff}
  .lbl{border:1px dashed #ddd;page-break-inside:avoid}
  .lbgrid{justify-content:flex-start}
}

/* ── QR ที่แสดงในหน้ารายละเอียดอุปกรณ์ ── */
.qrbox{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px;
  background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.qrbox .tg{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;font-weight:800;
  letter-spacing:.08em;color:#111}

/* ── แถบล่างของโหมดคนขับ ──────────────────────────────────────
   คนขับเห็นแค่สามอย่าง เพราะเขาทำอยู่สามอย่าง
   ไม่ใช่เมนูพนักงานที่ซ่อนปุ่มไปครึ่งหนึ่ง — แบบนั้นเดี๋ยวก็ลืมซ่อนสักอัน */
body.drvmode #side{display:none!important}
body.drvmode main{grid-column:1/-1!important;max-width:820px;margin:0 auto}
@media(min-width:900px){ body.drvmode #app{grid-template-columns:1fr!important} }
body.drvmode .nav{display:flex!important}
.drvcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  padding:14px;margin-bottom:12px}
.drvcard.live{border-color:var(--warn);border-width:2px}
.drvbig{width:100%;padding:17px;font-size:16.5px;font-weight:800;border-radius:var(--r);margin-top:12px}
.stopline{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.stopline .dot{width:9px;height:9px;border-radius:50%;background:var(--line);
  flex:0 0 auto;margin-top:6px}
.stopline.hit .dot{background:var(--ok)}

   ═══════════════════════════════════════════════════════════════ */

/* ── 1. CONFIG — แก้แค่ตรงนี้ ─────────────────────────────────── */

   ใช้ให้ปุ่ม Rich Menu พาไปหน้าที่ต้องการได้โดยตรง เช่น ?go=parcel-in */

    Apps Script ทำงานทีละคำขอ ยิ่งยิงถี่ยิ่งต่อคิวกันเองจนช้า */
async function cached(key, ttlMs, fn){
  const c = S.cache[key];
  if(c && Date.now() - c.at < ttlMs) return c.v;
  const v = await fn();
  S.cache[key] = { at:Date.now(), v };
  return v;
}
const clearCache = k => { if(k) delete S.cache[k]; else S.cache = {}; };
/** ข้อมูลหน้าแรกที่เซิร์ฟเวอร์แนบมากับ bootstrap — ใช้ได้ครั้งเดียวและต้องยังสด
    ไม่งั้นจะกลายเป็นข้อมูลค้างที่คนเข้าใจผิดว่ายังว่างอยู่ */
function takePre(key){
  const p = S.pre;
  if(!p || p.key !== key || Date.now() - p.at > 12000) return null;
  S.pre = null;
  return p.v;
}

/** วาดจากข้อมูลรอบก่อนทันที แล้วค่อยไปถามของใหม่มาวาดทับ
    Apps Script ตอบทีละคำขอและมีช่วงตื่นเครื่อง ยังไงก็มีหน่วงอยู่ดี
    แต่ตั้งแต่ครั้งที่สองเป็นต้นไป ผู้ใช้จะเห็นหน้าเต็มทันที ไม่ต้องนั่งมองโครงกระดูก */
async function swr(key, fetchFn, paint, maxAge = 0){
  const seq = RENDER_SEQ;
  const hit = S.cache[key];
  if(hit){
    try{ paint(hit.v, true); }catch(e){}
    // เพิ่งได้ข้อมูลชุดนี้มาสดๆ (เช่นแนบมากับ bootstrap) ไม่ต้องถามซ้ำ
    if(maxAge && Date.now() - hit.at < maxAge) return hit.v;
  }
  let v = null;
  try{ v = await fetchFn(); }catch(e){ if(!hit) throw e; return hit.v; }
  if(seq !== RENDER_SEQ) return v;      // ผู้ใช้เปลี่ยนหน้าไปแล้ว อย่าวาดทับหน้าใหม่
  S.cache[key] = { at:Date.now(), v };
  paint(v, false);
  return v;
}

/* ── 4. API — คุยกับ Apps Script เดิม (ไม่ต้องรื้อ backend) ───── */
async function api(action, payload = {}, method = 'GET'){
  if(DEMO){
    await new Promise(r => setTimeout(r, 260));       // จำลองดีเลย์จริง จะได้เห็น skeleton
    const v = MOCK[action];
    return (typeof v === 'function' ? v(payload) : v) ?? { ok:true };
  }
  if(!CFG.GAS_URL || CFG.GAS_URL.startsWith('PASTE_')) throw new Error('NO_CONFIG');
  const t0 = performance.now();
  const base = CFG.GAS_URL;
  const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const tm = ac ? setTimeout(() => ac.abort(), 20000) : null;
  let res;
  if(method === 'GET'){
    const q = new URLSearchParams({ action, uid:S.uid||'', _t:Date.now(), ...payload });
    res = await fetch(`${base}?${q}`, { method:'GET', redirect:'follow', cache:'no-store',
                                        signal: ac ? ac.signal : undefined });
  }else{
    // text/plain = simple request → ไม่มี CORS preflight ที่ Apps Script ตอบไม่ได้
    res = await fetch(base, {
      method:'POST', redirect:'follow',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, uid:S.uid, ...payload }),
      signal: ac ? ac.signal : undefined
    });
  }
  if(tm) clearTimeout(tm);
  const text = await res.text();
  try {
    const j = JSON.parse(text);
    // เก็บเวลาไว้ 12 รายการหลังสุด เอาไว้ดูว่าช้าที่เครือข่าย ที่ Apps Script หรือที่ชีท
    S.timings.unshift({ a:action, net:Math.round(performance.now()-t0),
                        srv:j?.ms ?? null, db:j?.dbMs ?? null });
    S.timings.length = Math.min(S.timings.length, 12);
    return j;
  }
  catch(e){
    // Apps Script คืน HTML แทน JSON ได้ในบางจังหวะ (cold start / หน้า redirect ของ Google)
    const err = new Error('BAD_RESPONSE');
    err.snippet = text.slice(0, 120);
    throw err;
  }
}

/* Apps Script ตื่นจากหลับ (cold start) ใช้เวลาได้หลายวินาที และบางครั้งคืน HTML
   → ลองซ้ำแบบถอยหลังเพิ่มทีละเท่า ก่อนจะยอมแพ้ */
async function apiRetry(action, payload, method, tries = 3){
  let last;
  for(let i = 0; i <= tries; i++){
    try{ return await api(action, payload, method); }
    catch(e){
      last = e;
      if(e.message === 'NO_CONFIG' || i === tries) break;
      await new Promise(r => setTimeout(r, 600 * Math.pow(2, i)));   // 0.6s → 1.2s → 2.4s
    }
  }
  throw last;
}

const ROUTES = {};
/* ผูกการเปลี่ยนหน้าเข้ากับประวัติเบราว์เซอร์
   ไม่ทำแบบนี้ ปุ่มย้อนกลับของมือถือจะเด้งออกจากแอปทันทีตั้งแต่หน้าแรก */
function go(name, params = {}, replace = false){
  if(replace){
    if(S.stack.length) S.stack[S.stack.length - 1] = { name, params };
    else S.stack.push({ name, params });
    try{ history.replaceState({ i:S.stack.length }, '', '#' + name); }catch(e){}
  }else{
    S.stack.push({ name, params });
    try{ history.pushState({ i:S.stack.length }, '', '#' + name); }catch(e){}
  }
  render(name, params);
}
function back(){
  if(S.stack.length > 1){ try{ history.back(); return; }catch(e){} }
  S.stack = []; go('home', {}, true);
}
window.addEventListener('popstate', () => {
  if(S.stack.length > 1){
    S.stack.pop();
    const prev = S.stack[S.stack.length - 1];
    render(prev.name, prev.params);
  }else{
    // อยู่หน้าแรกแล้วกดย้อนกลับ = ตั้งใจจะออกจริง ปล่อยให้ออกได้ตามปกติ
    render('home', {});
  }
});

document.querySelectorAll('#langTop button').forEach(b => b.onclick = () => {
  if(S.lang === b.dataset.l) return;
  S.lang = b.dataset.l;
  const cur = S.stack[S.stack.length - 1];
  render(cur?.name || 'home', cur?.params || {});
});

function chrome(name){
  if(S.driverMode){
    // หน้าที่คนขับเข้าได้มีเท่านี้ นอกจากนี้พาไปหน้างานของเขาแทน
    const okPages = ['driver-portal','driver-me','driver-report','driver-pair','offline','gate'];
    paintDriverNav(name);
    $('#backBtn').hidden = true;
    $('#brand').hidden   = true;
    $('#title').hidden   = false;
    $('#nav').hidden     = false;
    $('#fab').hidden     = true;
    $x('#langTop').hidden = false;
    $x('#side').style.display = 'none';
    if(!okPages.includes(name)) return;
    return;
  }
  paintNav();
  paintSide(name);
  const isHome = name === 'home';
  if(isHome) setTitle(t('navHome'));
  // 'privacy' = หน้าเดียวกับ consent แต่เปิดจากโปรไฟล์ → ต้องมีปุ่มกลับและเมนูล่าง
  const isFull = ['register','otp','consent','gate','offline'].includes(name);
  $('#backBtn').hidden = isHome || isFull;
  // จอคอมมีเมนูข้างที่มีโลโก้อยู่แล้ว แถบบนจึงควรบอก "อยู่หน้าไหน" ทุกหน้า รวมหน้าแรก
  $('#brand').hidden   = !isHome || window.innerWidth >= 900;
  $('#title').hidden   = isHome && window.innerWidth < 900;
  $('#nav').hidden     = isFull;
  $x('#side').style.display = isFull ? 'none' : '';
  $x('#langTop').hidden = isFull;
  // ปุ่มลอยโผล่เฉพาะหน้าที่เกี่ยวกับพัสดุและเมนูผู้ดูแลเท่านั้น
  // หน้าอื่น (โดยเฉพาะหน้าฉุกเฉิน) ห้ามมีอะไรมาบัง
  $('#fab').hidden = !S.isOfficer ||
                     !['my-parcels','unidentified','admin'].includes(name);
  document.querySelectorAll('.nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.go === name || (name === 'parcel-in' && b.dataset.go === 'my-parcels')));
}
let RENDER_SEQ = 0;
async function render(name, params){
  const seq = ++RENDER_SEQ;
  /* ลิงก์เก่าหรือปุ่มย้อนกลับพาคนขับไปหน้าพนักงานได้ — พาเขากลับมาหน้าของเขา
     เซิร์ฟเวอร์ปฏิเสธอยู่แล้ว แต่หน้าจอ error ไม่ได้ช่วยให้เขาทำงานต่อได้ */
  if(S.driverMode && !['driver-portal','driver-me','driver-report','driver-pair','offline','gate'].includes(name)){
    name = 'driver-portal'; params = {};
  }
  chrome(name);
  const fn = ROUTES[name] || ROUTES.home;
  $x('#main').innerHTML = `<div class="view">${skeleton(2)}</div>`;
  try{ await fn(params); }
  catch(e){
    if(seq !== RENDER_SEQ) return;   // ผู้ใช้เปลี่ยนหน้าไปแล้ว ไม่ต้องขึ้น error ของหน้าเก่า
    if(e.message === 'NO_CONFIG'){
      $x('#main').innerHTML = `<div class="view"><div class="note">${IC.info}<div><b>${t('noConfig')}</b><br>${t('noConfigBody')}</div></div></div>`;
    }else{
      errorScreen(e, () => render(name, params));
    }
  }
}

/** หน้าจอเวลาเชื่อมต่อไม่ได้ — ลองใหม่ได้ตรงนี้โดยไม่ต้องรีโหลดทั้งแอป
    และมีปุ่มทดสอบการเชื่อมต่อ เอาไว้ส่งข้อความ error ให้คนแก้ดู */
function errorScreen(e, retryFn){
  $x('#main').innerHTML = `<div class="view">
    <div class="empty">${IC.info}<h3>${esc(t('netErr'))}</h3><p>${esc(t('netErrHint'))}</p></div>
    <button class="btn primary" id="rt">${esc(t('retry'))}</button>
    <div style="height:9px"></div>
    <button class="btn ghost" id="dg">${esc(t('diag'))}</button>
    <pre id="dgOut" hidden style="margin-top:12px;padding:11px;background:var(--surface);
      border:1px solid var(--line);border-radius:12px;font-size:11px;
      white-space:pre-wrap;word-break:break-all;color:var(--ink-2)"></pre>
  </div>`;
  $('#rt').onclick = () => (retryFn ? retryFn() : location.reload());
  $('#dg').onclick = async () => {
    const box = $('#dgOut'); box.hidden = false; box.textContent = t('loading');
    let out = 'error: ' + (e?.message || e) + (e?.snippet ? '\nsnippet: ' + e.snippet : '') + '\n';
    out += 'uid: ' + (S.uid ? S.uid.slice(0,8) + '…' : '(none)') + '\n';
    out += 'liff: ' + (S.liffReady ? 'ok' : 'no') + '\n';
    // net = เวลารวมที่รอ · srv = เวลาที่ Apps Script ใช้จริง · db = เวลาอ่าน Google Sheet
    // net สูงแต่ srv ต่ำ = เสียเวลาไปกับการปลุกเครื่อง ไม่ใช่โค้ดเรา
    out += 'timings (net/srv/db ms):\n' + S.timings.map(x =>
      '  ' + x.a + ' ' + x.net + '/' + (x.srv ?? '-') + '/' + (x.db ?? '-')).join('\n') + '\n';
    try{
      const r = await api('ping', {}, 'GET');
      out += 'ping: ' + JSON.stringify(r);
    }catch(err){
      out += 'ping FAILED: ' + (err?.message || err) + (err?.snippet ? '\n' + err.snippet : '');
    }
    box.textContent = out;
  };
}

function licWarn(exp){
  if(!exp) return '';
  const days = Math.floor((Date.parse(exp) - Date.now()) / 86400000);
  if(isNaN(days) || days > 60) return '';
  const bad = days < 0;
  return `<div style="font-size:10.5px;font-weight:800;margin-top:2px;color:${
    bad ? 'var(--bad)' : 'var(--warn)'}">${esc(bad ? t('licExpired') : t('licSoon')(days))}</div>`;
}

    ${S.isOfficer ? `<button class="btn soft" id="toUn" style="margin-bottom:14px">${esc(t('unTitle'))}</button>` : ''}
    <div id="list">${skeleton(3)}</div></div>`;
  if($('#toUn')) $('#toUn').onclick = () => go('unidentified');
  const r = await apiRetry('getMyParcels', {}, 'GET');
  const items = r?.items || [];
  const waiting = items.filter(i => i.status === 'arrived' || i.status === 'notified');
  const done    = items.filter(i => i.status === 'claimed' || i.status === 'closed');
  if(!items.length){
    $x('#list').innerHTML = emptyState(IC.box, t('pcEmpty'), t('pcEmptyBody'));
    return;
  }
  const rowHtml = (p, act) => `
    <button class="row" data-id="${esc(p.record_id)}" ${act ? 'data-act="1"' : ''}>
      ${p.thumb_id ? `<img class="thumb" data-ph="${esc(p.thumb_id)}" alt="">` : `<div class="thumb">${IC.box}</div>`}

        <div class="t">${esc(p.title || p.tracking_no || (S.lang === 'th' ? 'พัสดุ' : 'Parcel'))}</div>
        <div class="s">${esc(t('pcArrived')(fmtDate(p.created_at)))}</div>
      </div>
      ${act ? `<span class="pill wait">${esc(t('pcWaiting'))}</span>` : `<span class="pill done">${esc(t('pcClaim'))}</span>`}
    </button>`;
  $x('#list').innerHTML = `
    ${waiting.length ? `<div class="section-title">${esc(t('pcWaiting'))}</div>
      <div class="rows">${waiting.map(p => rowHtml(p, true)).join('')}</div>` : ''}
    ${done.length ? `<div class="section-title">${esc(t('pcHistory'))}</div>
      <div class="rows">${done.map(p => rowHtml(p, false)).join('')}</div>` : ''}`;
  const byId = {}; items.forEach(p => byId[p.record_id] = p);
  document.querySelectorAll('#list .row[data-act]').forEach(b =>
    b.onclick = () => claimSheet(b.dataset.id, byId[b.dataset.id]));

  // มาจากลิงก์ในข้อความแจ้งเตือน หรือกดจากหน้าการแจ้งเตือน → เปิดพัสดุชิ้นนั้นเลย
  const focus = params.rec;
  if(focus && byId[focus]){
    const row = document.querySelector(`#list .row[data-id="${CSS.escape(focus)}"]`);
    if(row) row.scrollIntoView({ block:'center' });
    setTimeout(() => claimSheet(focus, byId[focus]), 260);
  }else if(focus){
    toast(t('recGone'));
  }
  paintPhotos($('#list'));
  document.querySelectorAll('#list img[data-ph]').forEach(im => {
    // แตะที่รูปเล็ก = เปิดดูจ่าหน้าเต็มจอทันที ไม่ต้องผ่านหน้ายืนยัน
    im.onclick = ev => {
      ev.stopPropagation();
      const p = byId[im.closest('.row').dataset.id] || {};
      openPhoto(p.photo_id || im.dataset.ph, p.title || '');
    };
  });
};

function claimSheet(id, parcel){

  sheet(`<h3>${esc(t('pcClaim'))}?</h3>
    <p class="sub">${esc(S.lang === 'th' ? 'ระบบจะบันทึกเวลาที่คุณกดรับไว้เป็นหลักฐาน' : 'The time you confirm is recorded as evidence.')}</p>

ROUTES['parcel-in'] = async () => {
  setTitle(t('inTitle'));
  $x('#main').innerHTML = `<div class="view">
    <label class="shot" id="shot">
      <input type="file" accept="image/*" capture="environment" id="file" hidden>
      <div class="ph">${IC.cam}<p>${esc(t('inShoot'))}</p>
        <p style="opacity:.7;font-weight:400;margin-top:4px">${esc(t('inShootSub'))}</p></div>
    </label>
    <div style="margin-top:14px" id="afterShot" hidden>
      <button class="btn soft" id="scanBtn">${esc(t('inScan'))}</button>
      <div class="field" style="margin-top:16px">
        <label>${esc(t('inRecipient'))}<span class="en">${esc(t('inRecipientEn'))}</span></label>
        <button class="picker-btn" id="rcp">
          <span class="nm ph" id="rcpNm">${esc(t('inPick'))}</span><span class="ch">▾</span>
        </button>
      </div>
      <div class="field">
        <label>${esc(t('inTracking'))}</label>
        <input id="trk" inputmode="latin" autocomplete="off" placeholder="TH01234567890">
      </div>
      <div class="sticky-cta"><button class="btn primary" id="saveBtn">${esc(t('inSave'))}</button></div>
    </div>
  </div>`;

  const fileEl = $('#file');
  $('#shot').onclick = e => { if(e.target.tagName !== 'INPUT') fileEl.click(); };
  fileEl.onchange = async () => {
    const f = fileEl.files[0]; if(!f) return;
    const im = await shrink2(f);
    S.draft.photo = im.full; S.draft.thumb = im.thumb;
    $x('#shot').innerHTML = `<img src="${im.full}" alt=""><span class="retake">${esc(t('inRetake'))}</span>`;
    $('#shot').onclick = () => fileEl.click();
    $('#afterShot').hidden = false;
  };

  // โหลดรายชื่อพนักงานล่วงหน้าตอนที่ผู้ใช้กำลังถ่ายรูป — พอเลื่อนลงมาจะพร้อมแล้ว
  if(!S.employees.length){
    try{ const r = await cached('emp', 6e5, () => apiRetry('getEmployees', {}, 'GET'));
         S.employees = r?.items || []; }catch(e){}
  }

  let chosen = null, isUnknown = false;
  const nmEl = $('#rcpNm'), saveBtn = $('#saveBtn');
  $('#rcp').onclick = async () => {
    const pick = await pickPerson();
    if(!pick) return;
    if(pick.unknown){
      isUnknown = true; chosen = null;
      nmEl.className = 'nm'; nmEl.textContent = t('inUnknown');
      saveBtn.textContent = t('inSaveUnknown');
    }else{
      isUnknown = false; chosen = pick;
      nmEl.className = 'nm';
      nmEl.innerHTML = `${esc(pick.name_th || pick.name_en)}` +
        (pick.department ? `<small>${esc(pick.department)}</small>` : '');
      saveBtn.textContent = t('inSave');
    }
  };

  $('#scanBtn').onclick = async () => {
    const b = $('#scanBtn'); b.disabled = true; b.textContent = t('inScanning');
    try{
      const r = await apiRetry('scanParcelPhoto', { photo:S.draft.photo }, 'POST');
      if(r?.trackingNo) $('#trk').value = r.trackingNo;
      const guess = (r?.recipientName || '').trim();
      let matched = null;
      if(guess){
        const n = s => String(s || '').toLowerCase().replace(/\s|\./g, '');
        const g = n(guess);
        matched = S.employees.find(p => n(p.name_th) === g || n(p.nickname) === g)
               || S.employees.find(p => g.includes(n(p.nickname)) && n(p.nickname).length > 1)
               || S.employees.find(p => n(p.name_th).includes(g) && g.length > 2);
      }
      if(matched){
        // AI เดาให้ แต่ยังต้องให้คนกดยืนยันเสมอ — แจ้งผิดคนเสียความเชื่อมั่นกว่าที่คิด
        chosen = matched; isUnknown = false;
        nmEl.className = 'nm';
        nmEl.innerHTML = `${esc(matched.name_th || matched.name_en)}` +
          (matched.department ? `<small>${esc(matched.department)}</small>` : '');
        saveBtn.textContent = t('inSave');
      }
      toast(matched ? t('inScanOk') : t('inScanFail'), matched ? 'ok' : '');
    }catch(e){ toast(t('inScanFail')); }
    b.disabled = false; b.textContent = t('inScan');
  };

  saveBtn.onclick = async () => {
    if(!S.draft.photo){ toast(t('inNeedPhoto'), 'bad'); return; }
    const unknown = isUnknown || !chosen;
    const btn = saveBtn; btn.disabled = true;
    try{
      await apiRetry('logParcel', {
        photo:S.draft.photo,
        thumb:S.draft.thumb,
        recipient_id: unknown ? '' : chosen.kenan_user_id,
        recipient_name: unknown ? '' : (chosen.name_th || chosen.name_en || ''),
        tracking_no: $('#trk').value.trim()
      }, 'POST');
      S.draft = { photo:null, thumb:null, scan:null, recipient:null, tracking:'' };
      toast(unknown ? t('inDoneUnknown') : t('inDone'), 'ok');
      go('parcel-in', {}, true);   // พร้อมถ่ายชิ้นถัดไปทันที ไม่ต้องกดกลับ
    }catch(e){ toast(t('netErr'), 'bad'); btn.disabled = false; }
  };
};

        { phone:$('#pPhone').value.trim(), position:$('#pPos').value.trim(),
          birthday:$('#pBd').value.trim(), birth_year:$('#pBy').value.trim(),
          show_birthday:$('#pShowBd').checked ? 'true' : 'false',
          show_birth_year:$('#pShowYr').checked ? 'true' : 'false',
          photo:pimg.v?.full || '', card:pimg.v?.card || '',
          show_phone:$('#pShow').checked ? 'true' : 'false' }, 'POST');
      S.me = S.me || {}; S.me.phone = $('#pPhone').value.trim();
      S.me.position = $('#pPos').value.trim(); S.me.show_phone = $('#pShow').checked;
      S.me.birthday = $('#pBd').value.trim(); S.me.show_birthday = $('#pShowBd').checked;
      S.me.birth_year = $('#pBy').value.trim(); S.me.show_birth_year = $('#pShowYr').checked;
      if(pimg.v?.card) S.me.photo = pimg.v.card;
      clearCache('dir'); clearCache('emp');
      toast(t('prSaved'), 'ok');
    }catch(e){ toast(t('netErr'), 'bad'); }
    b.disabled = false;
  };
  $('#pol').onclick = () => go('privacy');

  /* ปุ่มวัดความเร็ว — เอาไว้ส่งตัวเลขจริงให้คนแก้ดู
     net = รอทั้งหมด · srv = Apps Script ใช้จริง · db = อ่าน Google Sheet
     net สูงแต่ srv ต่ำ แปลว่าเสียเวลาไปกับการปลุกเครื่อง ไม่ใช่โค้ดช้า */
  $('#spd').onclick = async () => {
    const box = $('#spdOut'); box.hidden = false; box.textContent = t('loading');
    const t1 = performance.now(); const p1 = await apiRetry('ping', {}, 'GET');
    const cold = Math.round(performance.now() - t1);
    const t2 = performance.now(); await apiRetry('ping', {}, 'GET');
    const warm = Math.round(performance.now() - t2);
    // ถ้ารุ่นไม่ตรง ตัวเลขที่วัดได้จะเป็นของโค้ดเก่า ต้องบอกก่อนเป็นอย่างแรก
    const okBuild = p1?.build === CFG.BUILD;
    box.textContent =
      (okBuild ? '✅ ' + t('spdBuildOk') + ' (' + CFG.BUILD + ')'
               : '⚠️ ' + t('spdBuildBad') + '\n   ' + t('spdBuildApp') + ': ' + CFG.BUILD +
                 '\n   ' + t('spdBuildSrv') + ': ' + (p1?.build || t('spdBuildOld'))) + '\n\n' +
      t('spdFirst') + ': ' + cold + ' ms\n' +
      t('spdSecond') + ': ' + warm + ' ms\n\n' +
      'action  net / srv / db (ms)\n' +
      S.timings.map(x => x.a + '  ' + x.net + ' / ' + (x.srv ?? '-') + ' / ' + (x.db ?? '-')).join('\n');
  };
};

    <div id="ulist">${skeleton(4)}</div></div>`;

  let users = [];
  try{ const r = await apiRetry('getUsersForAdmin', {}, 'GET'); users = r?.items || []; }catch(e){}

  const badge = u => {
    const r = String(u.roles || 'staff');
    if(u.is_super)            return `<span class="pill new">${esc(t('roleSuper'))}</span>`;
    if(r.includes('admin'))   return `<span class="pill new">${esc(t('roleAdmin'))}</span>`;

    return `<span class="pill" style="background:var(--neutral);color:var(--ink-3)">${esc(t('roleStaff'))}</span>`;
  };
  const paint = kw => {
    const k = String(kw || '').toLowerCase();
    const hits = users.filter(u => !k ||
      String(u.name_th).toLowerCase().includes(k) ||
      String(u.nickname).toLowerCase().includes(k) ||
      String(u.email).toLowerCase().includes(k));
    $x('#ulist').innerHTML = `<div class="rows">${hits.map(u => `
      <button class="row" data-id="${esc(u.kenan_user_id)}" ${u.is_super ? 'disabled style="opacity:.6"' : ''}>

          <div class="t">${esc(u.name_th)}${u.nickname ? ' · ' + esc(u.nickname) : ''}</div>
          <div class="s">${esc(u.email)}</div>
        </div>${badge(u)}
      </button>`).join('')}</div>`;
    document.querySelectorAll('#ulist .row:not([disabled])').forEach(b =>
      b.onclick = () => roleSheet(users.find(x => x.kenan_user_id === b.dataset.id)));
  };

  function roleSheet(u){
    const cur = String(u.roles || 'staff');

    const opt = (v, th, sub) => `
      <button class="row" data-r="${v}" style="border-radius:12px;border:1.5px solid ${

ROUTES.directory = async () => {
  setTitle(t('dirTitle'));
  $x('#main').innerHTML = `<div class="view">
    <input id="dq" placeholder="${esc(t('pkSearch'))}"
      style="width:100%;padding:13px 14px;border:1.5px solid var(--line);
             border-radius:12px;font-size:16px;margin-bottom:12px">
    <div id="dl" class="dircols">${skeleton(4)}</div></div>`;
  let people = [];
  const preDir = takePre('dir');
  if(preDir) S.cache.dir = { at:Date.now(), v:preDir };
  try{ const r = await cached('dir', 3e5, () => apiRetry('getDirectory', {}, 'GET'));
       people = r?.items || []; }catch(e){}
  if(!people.length){ $x('#dl').innerHTML = emptyState(IC.info, t('dirEmpty'), t('dirEmptyBody')); return; }

  const norm = s => String(s || '').toLowerCase().replace(/\s|\./g, '');
  const paint = kw => {
    const k = norm(kw);
    const hits = !k ? people : people.filter(p =>
      norm(p.name_th).includes(k) || norm(p.name_en).includes(k) ||
      norm(p.nickname).includes(k) || norm(p.department).includes(k));
    if(!hits.length){ $x('#dl').innerHTML = `<div class="pk-empty">${esc(t('pkNone'))}</div>`; return; }
    // จัดกลุ่มตามแผนก — หาคนง่ายกว่าเรียงชื่อยาวๆ 40 คนรวด
    const groups = {};
    hits.forEach(p => { (groups[p.department || '—'] ||= []).push(p); });
    $x('#dl').innerHTML = Object.keys(groups).map(d => `
      <div class="dgrp">
      <div class="section-title">${esc(d)}</div>
      <div class="rows">${groups[d].map(p => `
        <button class="row" data-id="${esc(p.kenan_user_id)}" ${p.pending ? 'style="opacity:.62"' : ''}>
          ${p.photo ? `<img class="av" src="${p.photo}" alt="">`
            : `<span class="av">${esc(String(p.nickname || p.name_th || '?').trim().charAt(0))}</span>`}
          <div class="body">
            <div class="t">${esc(p.name_th || p.name_en)}${p.nickname ? ' · ' + esc(p.nickname) : ''}${
              p.pending ? ` <span class="pill" style="background:var(--neutral);color:var(--ink-3);font-size:9.5px">${esc(t('dirPending'))}</span>` : ''}</div>
            <div class="s">${esc(p.position || p.phone || p.email || t('dirNoPhone'))}</div>
          </div><span class="go">${IC.chev}</span>
        </button>`).join('')}</div></div>`).join('');
    // ปุ่มวงกลมเล็กๆ สองอันชิดกันกดพลาดง่ายบนมือถือ → เปิดการ์ดที่มีปุ่มเต็มความกว้างแทน
    // ให้พนักงานรู้ว่าต้องติดต่อใครเวลามีปัญหา แทนที่จะเดินถามกันไปทั้งออฟฟิศ
  const staff = people.filter(p => /(^|,)\s*(admin|officer)\s*(,|$)/.test(String(p.roles || '')));
  if(staff.length){
    $x('#dl').insertAdjacentHTML('afterbegin', `<div class="dgrp">
      <div class="section-title">${esc(t('dirAdmins'))}</div>
      <div class="rows">${staff.map(p => `
        <button class="row" data-id="${esc(p.kenan_user_id)}">
          <span class="av" style="background:var(--navy);color:#fff">${
            esc(String(p.name_th || '?').trim().charAt(0))}</span>
          <div class="body"><div class="t">${esc(p.name_th || p.name_en)}</div>
            <div class="s">${esc([p.position, p.department].filter(Boolean).join(' · '))}</div></div>
          <span class="go">${IC.chev}</span></button>`).join('')}</div></div>`);
  }
  document.querySelectorAll('#dl .row[data-id]').forEach(b => b.onclick = () => {
      const p = people.find(x => x.kenan_user_id === b.dataset.id); if(!p) return;
      sheet(`${p.photo ? `<img src="${p.photo}" alt=""
          style="width:88px;height:88px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px">` : ''}
        <h3 style="text-align:center">${esc(p.name_th || p.name_en)}${p.nickname ? ' · ' + esc(p.nickname) : ''}</h3>
        <p class="sub" style="text-align:center">${esc([p.position, p.department, p.office].filter(Boolean).join(' · '))}</p>
        ${p.phone ? `<a class="btn primary" href="tel:${esc(p.phone)}"
            style="text-decoration:none">📞 ${esc(t('dirCall'))} ${esc(p.phone)}</a>` : ''}
        ${p.email ? `<a class="btn ghost" href="mailto:${esc(p.email)}"
            style="text-decoration:none;word-break:break-all">✉ ${esc(p.email)}</a>` : ''}
        ${p.phone ? `<button class="btn ghost" id="cp">${esc(t('dirCopy'))}</button>` : ''}
        <button class="btn ghost" id="cx">${esc(t('close'))}</button>`);
      $('#cx').onclick = closeSheet;
      if($('#cp')) $('#cp').onclick = async () => {
        try{ await navigator.clipboard.writeText(p.phone); toast(t('dirCopied'), 'ok'); }
        catch(e){ toast(p.phone); }
      };
    });
  };
  paint('');
  $('#dq').oninput = e => paint(e.target.value);
};

/* ── ห้องประชุม ─────────────────────────────────────────────── */
/* ── เวลาทุกจุดในแอปยึดเวลาไทย ไม่ใช่เวลาของเครื่อง ───────────────
   ของเดิมใช้เวลาเครื่อง ซึ่งตรงกันเกือบตลอดจนไม่มีใครสังเกต
   แต่พังเงียบๆ กับสองกรณีที่เกิดจริงในออฟฟิศนี้:
   เจ้าหน้าที่ต่างชาติที่ยังไม่ได้ตั้งโซนเวลาเครื่องเป็นไทย
   และคนที่เปิดแอปตอนไปราชการต่างประเทศ — เขาจะเห็นทุกการจองเลื่อนไปทั้งวัน
   แล้วไปถึงห้องผิดเวลาโดยที่ระบบไม่ได้เตือนอะไรเลย                        */
const BKK_TZ = 'Asia/Bangkok';
const _bkkFmt = new Intl.DateTimeFormat('en-GB', { timeZone:BKK_TZ,
  year:'numeric', month:'2-digit', day:'2-digit',
  hour:'2-digit', minute:'2-digit', hour12:false });
function bkkParts(d){
  const p = {};
  _bkkFmt.formatToParts(new Date(d)).forEach(x => { if(x.type !== 'literal') p[x.type] = x.value; });
  // เที่ยงคืนบางเครื่องคืนมาเป็น 24 — ปรับให้เป็น 00 ตามที่คนอ่าน
  if(p.hour === '24') p.hour = '00';
  return p;
}
const dayKey = d => { const p = bkkParts(d); return `${p.year}-${p.month}-${p.day}`; };
const hhmm = iso => { try{ const p = bkkParts(iso); return `${p.hour}:${p.minute}`; }catch(e){ return ''; } };
const H0 = 8, H1 = 18, HPX = 44;            // ตาราง 08:00–18:00 ช่องละ 44px
const minsFrom8 = iso => { const p = bkkParts(iso);
  return (Number(p.hour) - H0) * 60 + Number(p.minute); };
/* ในช่องแคบๆ ของตาราง เวลาเริ่มกับชื่อเต็มอ่านไม่ทัน
   บอก "ยาวแค่ไหน" กับ "ใคร" พอ — เวลาเริ่มดูได้จากตำแหน่งของบล็อกอยู่แล้ว */
const durLabel = (s, e) => {
  const m = Math.round((Date.parse(e) - Date.parse(s)) / 60000);
  if(m < 60) return m + (S.lang==='th' ? ' น.' : 'm');
  const hh = Math.floor(m/60), mm = m%60;
  return hh + (mm ? '.' + Math.round(mm/6) : '') + (S.lang==='th' ? ' ชม.' : ' hr');
};
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';

  // ── ตาราง
  const cols = mode === 'day'
    ? r.rooms.map(rm => ({ key:rm.resource_id, n:rm.name_th.replace('ห้อง ',''),
                           c: rm.capacity ? t('rmSeats')(rm.capacity) : '' }))
    : days.slice(0,7).map(d => ({ key:dayKey(d),
        n:d.toLocaleDateString(S.lang==='th'?'th-TH':'en-GB',{weekday:'short'}), c:String(d.getDate()) }));

  const evFor = col => r.bookings.filter(b =>
    mode === 'day' ? b.resource_id === col.key
                   : (b.resource_id === room0 && dayKey(b.start_at) === col.key));

  const nowTop = (() => {
    const n = new Date();
    if(dayKey(n) !== sel && mode === 'day') return null;
    const m = (n.getHours()-H0)*60 + n.getMinutes();
    return (m < 0 || m > (H1-H0)*60) ? null : (m/60)*HPX;
  })();

  $x('#rl').innerHTML = `<div class="gridwrap"><div class="gridscroll"><div style="min-width:${34+cols.length*84}px">
    <div class="ghead"><div class="corner"></div>${cols.map(c => `
      <div class="hcell"><div class="n">${esc(c.n)}</div><div class="c">${esc(c.c)}</div></div>`).join('')}</div>
    <div class="gbody">
      <div class="ghours">${Array.from({length:H1-H0+1},(_,i)=>`<span>${String(H0+i).padStart(2,'0')}</span>`).join('')}</div>
      ${cols.map(c => `<div class="gcol" data-k="${esc(c.key)}">
        ${Array.from({length:H1-H0},(_,i)=>`<div class="hr" data-h="${H0+i}"></div>`).join('')}
        ${evFor(c).map(b => {
          const top = Math.max(0,(minsFrom8(b.start_at)/60)*HPX);
          const hgt = Math.max(20,((minsFrom8(b.end_at)-minsFrom8(b.start_at))/60)*HPX-2);
          const mine = String(b.requester_id) === String(S.me?.kenan_user_id);
          return `<button class="gev ${mine?'mine':''}" data-b="${esc(b.record_id)}"

            <div class="w">${esc(firstName(b.who))}</div></button>`;
        }).join('')}
      </div>`).join('')}
      ${nowTop!==null?`<div class="gnow" style="top:${nowTop}px"></div>`:''}
    </div>
  </div></div></div>
  <div style="font-size:11.5px;color:var(--ink-3);margin-top:8px;text-align:center">${esc(t('rmTapSlot'))}</div>`;

  // แตะช่องว่าง = จองเลย · แตะรายการที่มีอยู่ = ดูว่าใครจอง (ขอสลับได้)
  document.querySelectorAll('#rl .hr').forEach(cell => cell.onclick = () => {

  });
  document.querySelectorAll('#rl .gev').forEach(el => el.onclick = ev => {
    ev.stopPropagation();
    const b = r.bookings.find(x => x.record_id === el.dataset.b); if(!b) return;
    const mine = String(b.requester_id) === String(S.me?.kenan_user_id);
    const rm = r.rooms.find(x => x.resource_id === b.resource_id);
    sheet(`<h3>${esc(b.title)}</h3>
      <p class="sub">${esc(rm?.name_th || '')} · ${esc(fmtDate(b.start_at))} – ${esc(hhmm(b.end_at))}</p>
      <div class="rows" style="margin-bottom:12px"><div class="row">
        <span class="av">${esc(String(b.who||'?').trim().charAt(0))}</span>
        <div class="body"><div class="t">${esc(b.who)}</div>
          <div class="s">${esc(b.who_dept || '')}</div></div></div></div>
      ${mine ? `<button class="btn danger" id="cx2" style="background:var(--bad);color:#fff">${esc(t('rmCancel'))}</button>`
        : `<div class="note info">${IC.info}<div>${esc(t('rmSwapHint'))}</div></div>
           ${b.who_phone?`<a class="btn primary" href="tel:${esc(b.who_phone)}" style="text-decoration:none;margin-top:10px">📞 ${esc(b.who_phone)}</a>`:''}
           ${b.who_email?`<a class="btn ghost" href="mailto:${esc(b.who_email)}" style="text-decoration:none;word-break:break-all">✉ ${esc(b.who_email)}</a>`:''}`}
      <button class="btn ghost" id="cl">${esc(t('close'))}</button>`);
    $('#cl').onclick = closeSheet;
    if($('#cx2')) $('#cx2').onclick = async () => {
      closeSheet();
      try{ await apiRetry('cancelRoomBooking', { record_id:b.record_id }, 'POST');
           toast(t('rmCancelled'),'ok'); go('rooms', { date:sel, mode, kind }, true); }
      catch(e){ toast(t('netErr'),'bad'); }

  });

  // ── การ์ดห้อง: รูป + จำนวนที่นั่ง
  $x('#rooms').innerHTML = r.rooms.map(rm => `
    <button class="rcard" data-r="${esc(rm.resource_id)}">

        <div style="font-size:11.5px;color:var(--ink-3)">${
          esc([rm.capacity ? t('rmSeats')(rm.capacity) : '', rm.category, rm.note].filter(Boolean).join(' · '))}</div>
      </div><span class="go">${IC.chev}</span>
    </button>`).join('');
  paintPhotos($('#rooms'));
  document.querySelectorAll('#rooms .rcard').forEach(b =>
    b.onclick = () => go('room-new', { date:sel, room:b.dataset.r, kind }));
};

ROUTES['room-new'] = async ({ date, room:preRoom, hour, kind:k0 } = {}) => {
  const kind = k0 === 'zoom' ? 'zoom' : 'room';
  setTitle(kind === 'zoom' ? t('zoomTitle') : t('rmBook'));
  const day = date || dayKey(new Date());
  const h1  = hour ? String(hour).padStart(2,'0') + ':00' : '09:00';
  const h2  = hour ? String(Math.min(Number(hour)+1,18)).padStart(2,'0') + ':00' : '10:00';
  let rooms = [];
  try{ const r = await apiRetry('getRoomDay', { date:day, kind }, 'GET'); rooms = r?.rooms || []; }catch(e){}

  $x('#main').innerHTML = `<div class="view">
    <div class="card">
      <div style="font-size:13px;font-weight:600;margin-bottom:9px">${esc(kind === 'zoom' ? t('zoomPick') : t('rmPick'))}</div>
      <div id="rp">${rooms.map((rm, i) => `
        <button class="row" data-v="${esc(rm.resource_id)}" style="border:1.5px solid ${
          (preRoom?rm.resource_id===preRoom:i===0)?'var(--primary)':'var(--line)'};border-radius:12px;
          margin-bottom:8px;background:${(preRoom?rm.resource_id===preRoom:i===0)?'#EEF3FF':'#fff'}">
          ${phImg(rm,'rphoto','width:52px;height:40px') || `<div class="rphoto" style="width:52px;height:40px">${IC.cal}</div>`}
          <div class="body"><div class="t">${esc(rm.name_th)}</div>
            <div class="s">${esc([rm.capacity?t('rmSeats')(rm.capacity):'', rm.note].filter(Boolean).join(' · '))}</div></div>
          <span class="ck" style="color:var(--primary);font-weight:800;${
            (preRoom?rm.resource_id===preRoom:i===0)?'':'visibility:hidden'}">✓</span>
        </button>`).join('')}</div>
    </div>
    <div class="card">
      <label class="switch" style="margin-bottom:12px">
        <input type="checkbox" id="rmulti">
        <span><b>${esc(t('rmMulti'))}</b></span>
      </label>
      <div class="times">
        <div class="tbox"><div class="k">${esc(t('rmFrom'))}</div>
          <input type="date" id="dd" value="${day}" class="tin">
          <input type="time" id="t1" value="${h1}" class="tin big"></div>
        <div class="arrow">→</div>
        <div class="tbox hl"><div class="k">${esc(t('rmTo'))}</div>
          <input type="date" id="dd2" value="${day}" class="tin" hidden>
          <input type="time" id="t2" value="${h2}" class="tin big"></div>
      </div>
    </div>
    <div class="card">
      <div class="field" style="margin:0"><label>${esc(t('rmSubject'))}<span class="req">*</span></label>
        <input id="ti" placeholder="${esc(t('rmSubjectPh'))}"></div>
    </div>
    <div class="note info">${IC.info}<div>${esc(t('rmIcsHint'))}</div></div>
    <div class="sticky-cta"><button class="btn primary" id="go">${esc(t('rmGo'))}</button></div>
  </div>`;

  $('#rmulti').onchange = () => {
    $('#dd2').hidden = !$('#rmulti').checked;
    if($('#rmulti').checked && $('#dd2').value <= $('#dd').value){
      const n = new Date($('#dd').value + 'T00:00:00'); n.setDate(n.getDate() + 1);
      $('#dd2').value = dayKey(n);
    }
  };
  let room = preRoom || rooms[0]?.resource_id || '';
  paintPhotos($('#rp'));
  document.querySelectorAll('#rp .row').forEach(b => b.onclick = () => {
    room = b.dataset.v;
    document.querySelectorAll('#rp .row').forEach(x => {
      const on = x === b;
      x.style.borderColor = on ? 'var(--primary)' : 'var(--line)';
      x.style.background  = on ? '#EEF3FF' : '#fff';
      x.querySelector('.ck').style.visibility = on ? 'visible' : 'hidden';
    });
  });
  $('#go').onclick = async () => {
    const title = $('#ti').value.trim();
    if(!title){ toast(t('admNeedTitle'), 'bad'); return; }
    const d = $('#dd').value, a = $('#t1').value, z = $('#t2').value;
    const d2 = ($('#rmulti').checked && $('#dd2').value) ? $('#dd2').value : d;
    if(!d || !a || !z){ toast(t('rmBadTime'), 'bad'); return; }
    const sIso = `${d}T${a}:00+07:00`, eIso = `${d2}T${z}:00+07:00`;
    if(Date.parse(eIso) <= Date.parse(sIso)){ toast(t('rmBadTime'), 'bad'); return; }
    const b = $('#go'); b.disabled = true;
    try{
      const r = await apiRetry('createRoomBooking', {
        resource_id:room, title, start_at:sIso, end_at:eIso
      }, 'POST');
      if(r?.error === 'CLASH'){
        toast(`${t('rmClash')} · ${r.clash?.who || ''}`, 'bad');
        b.disabled = false; return;
      }
      if(r?.ok === false) throw 0;
      toast(t('rmOk'), 'ok');
      S.stack = [{ name:'home', params:{} }]; go('rooms', { date:d, kind });
    }catch(e){ toast(t('netErr'), 'bad'); b.disabled = false; }
  };
};

/* ข้อความในกรอบถ่ายรูปต้องตรงกับสิ่งที่กำลังถ่าย
   ของเดิมใช้ข้อความของพัสดุกับทุกที่ ตอนเพิ่มอุปกรณ์จึงขึ้นว่า "ถ่ายรูปกล่อง"
   ซึ่งคนอ่านแล้วงงว่ากล่องอะไร */
function photoField(id, label, current, opt){
  const o = opt || {};
  return `<div class="field"><label>${esc(label)}${o.optional ? '' : '<span class="req">*</span>'}</label>
    <label class="shot" id="${id}s" style="aspect-ratio:${o.ratio || '16/9'}${
      o.max ? ';max-height:' + o.max : ''}">
      <input type="file" accept="image/*" id="${id}" hidden>
      ${current ? `<img src="${current}" alt="" style="width:100%;height:100%;object-fit:cover">`
                : `<div class="ph">${IC.cam}<p>${esc(o.prompt || t('inShootAny'))}</p></div>`}
    </label></div>`;
}
function wirePhoto(id, store, onPick){
  const el = document.getElementById(id);
  const box = document.getElementById(id + 's');
  if(!el || !box) return;
  box.onclick = e => { if(e.target.tagName !== 'INPUT') el.click(); };
  el.onchange = async () => {
    const f = el.files[0]; if(!f) return;
    const im = await shrink2(f); store.v = im;
    box.innerHTML = `<img src="${im.full}" alt=""><span class="retake">${esc(t('inRetake'))}</span>`;
    box.onclick = () => el.click();
    if(typeof onPick === 'function') onPick(im);
  };
}

  $('#prev').onclick = () => {
    const raw = $('#sp').value.trim();
    if(!raw){ toast(t('admNeedTitle'),'bad'); return; }
    // แยกด้วย tab ก่อน (วางจาก Excel) ถ้าไม่มีจึงลองคอมมา
    rows = raw.split(/\n+/).map(line => {
      const cells = (line.includes('\t') ? line.split('\t') : line.split(',')).map(x => x.trim());
      const o = {}; HEAD.forEach((h, i) => o[h] = cells[i] || '');
      return o;
    }).filter(r => r.name_th || r.email);
    // ถ้าบรรทัดแรกเป็นหัวตาราง ตัดออก
    if(rows.length && !/@/.test(rows[0].email) && /mail|อีเมล/i.test(rows[0].email)) rows.shift();

    const bad = rows.filter(r => !/^[^@\s]+@kenan-asia\.org$/.test(r.email));
    $x('#pv').innerHTML = `
      <div class="section-title">${esc(t('admStaffFound')(rows.length))}</div>
      ${bad.length ? `<div class="note" style="border-color:var(--bad);margin-bottom:12px">${IC.info}
        <div><b>${esc(t('admStaffBad')(bad.length))}</b><br>${
          bad.slice(0,5).map(r => esc((r.name_th || '?') + ' — ' + (r.email || t('admStaffNoMail')))).join('<br>')}</div></div>` : ''}
      <div class="rows">${rows.slice(0,60).map(r => `
        <div class="row"><span class="av">${esc(String(r.name_th || '?').trim().charAt(0))}</span>
          <div class="body"><div class="t">${esc(r.name_th || '—')}</div>
            <div class="s">${esc([r.email, r.department, r.position].filter(Boolean).join(' · '))}</div></div>
          ${/^[^@\s]+@kenan-asia\.org$/.test(r.email)
            ? '<span class="pill done">✓</span>'
            : '<span class="pill" style="background:var(--bad-bg);color:var(--bad)">✕</span>'}
        </div>`).join('')}</div>
      ${rows.length > 60 ? `<div class="quiet">${esc(t('admStaffMore')(rows.length - 60))}</div>` : ''}
      <button class="btn primary" id="imp2" style="margin-top:14px">${
        esc(t('admStaffGo')(rows.length - bad.length))}</button>`;

    $('#imp2').onclick = async () => {
      const b = $('#imp2'); b.disabled = true; b.textContent = t('loading');
      try{
        const r = await apiRetry('importStaff', { rows: JSON.stringify(rows) }, 'POST');
        if(!r?.ok) throw 0;
        clearCache();
        $x('#pv').innerHTML = `<div class="note info" style="margin-top:14px">${IC.info}<div>
          <b>${esc(t('admStaffDone')(r.added, r.updated))}</b>
          ${(r.skipped || []).length ? '<br>' + esc(t('admStaffSkipped')) + '<br>' +
            r.skipped.map(x => esc(x)).join('<br>') : ''}</div></div>
          <button class="btn soft" id="toDir" style="margin-top:12px">${esc(t('mDir'))} →</button>`;
        $('#toDir').onclick = () => go('directory');
      }catch(e){ toast(t('netErr'),'bad'); b.disabled = false; b.textContent = t('admStaffGo')(rows.length); }
    };
  };
};

ROUTES['admin-proj'] = async () => {

          p.pm_name ? 'var(--ok)' : 'var(--warn)'}">${
          esc(p.pm_name ? 'PM: ' + p.pm_name + (p.member_names?.length ? ` · ${p.member_names.length} ${t('admProjMemN')}` : '')
                        : t('admProjNoPm'))}</div>
        ${p.trips ? `<div style="font-size:10.5px;color:var(--ink-3);margin-top:2px">${
          esc(t('admProjTrips')(p.trips))}</div>` : ''}
      </div>
      ${p.is_active ? `<span class="go">${IC.chev}</span>`
        : `<span class="pill" style="background:var(--neutral);color:var(--ink-3)">${esc(t('admResInactive'))}</span>`}
    </button>`).join('')}</div>`
    : emptyState(IC.info, t('admProjEmpty'), t('admProjEmptyBody'));

  document.querySelectorAll('#pl .row').forEach(b =>
    b.onclick = () => projEdit(items.find(x => x.project_code === b.dataset.c)));

  function projEdit(it){
    sheet(`<h3>${esc(it ? it.project_code : t('admProjAdd'))}</h3>
      <div class="field"><label>${esc(t('admProjCode'))}<span class="req">*</span></label>
        <input id="pc" value="${esc(it?.project_code || '')}" placeholder="${esc(t('admProjCodePh'))}"
